<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Loader</title>
    <style>
        /* Base styles to center the loader */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff; /* Pure white background outside */
        }

        /* From Uiverse.io by egehan_1415 (Adapted for Light Theme) */ 
        .ui-loader {
          width: 340px;
          border-radius: 18px;
          border: 1px solid rgba(0, 0, 0, 0.08);
          background: #f7f7f9; /* near-white with a faint grey tint */
          box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.08),
            inset 0 0 0 1px rgba(139, 92, 246, 0.55),
            inset 0 0 8px rgba(139, 92, 246, 0.45);
          overflow: hidden;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          position: relative;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            "Liberation Mono", "Courier New", monospace;
          animation: edgeGlow 3s ease-in-out infinite;
        }

        @keyframes edgeGlow {
          0%, 100% {
            box-shadow:
              0 15px 35px rgba(0, 0, 0, 0.08),
              inset 0 0 0 1px rgba(139, 92, 246, 0.45),
              inset 0 0 6px rgba(139, 92, 246, 0.35);
          }
          50% {
            box-shadow:
              0 15px 35px rgba(0, 0, 0, 0.08),
              inset 0 0 0 1px rgba(139, 92, 246, 0.8),
              inset 0 0 12px rgba(139, 92, 246, 0.6);
          }
        }

        .term-bar {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 12px 12px;
          border-bottom: 1px solid rgba(0, 0, 0, 0.06);
          background: #d1d5db; /* Slightly darker grey for the top bar */
        }
        .term-title {
          font:
            700 12px/1 ui-sans-serif,
            system-ui;
          color: rgba(0, 0, 0, 0.5);
          letter-spacing: 0.2px;
        }

        .term-body {
          padding: 14px 14px 16px;
          color: rgba(0, 0, 0, 0.55);
          font-size: 12px;
          line-height: 1.55;
        }

        .line {
          margin: 6px 0;
        }
        .line b {
          color: rgba(0, 0, 0, 0.65);
        }
        .muted {
          color: rgba(0, 0, 0, 0.4);
        }

        /* From Uiverse.io by krlozCJ */
        .loader {
          --size-loader: 14px;
          --size-orbe: 4px;
          width: var(--size-loader);
          height: var(--size-loader);
          position: relative;
          transform: rotate(45deg);
          display: inline-block;
          vertical-align: middle;
          margin-right: 0;
        }
        .orbe {
          position: absolute;
          width: 100%;
          height: 100%;
          --delay: calc(var(--index) * 0.1s);
          animation: orbit7456 ease-in-out 1.5s var(--delay) infinite;
          opacity: calc(1 - calc(0.2 * var(--index)));
        }
        .orbe::after {
          position: absolute;
          content: '';
          top: 0;
          left: 0;
          width: var(--size-orbe);
          height: var(--size-orbe);
          background-color: #8b5cf6;
          box-shadow: 0px 0px 6px 0px rgba(139, 92, 246, 0.6);
          border-radius: 50%;
        }
        @keyframes orbit7456 {
          0% {
          }
          80% {
            transform: rotate(360deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }

        .progress {
          margin-top: 12px;
          height: 8px;
          border-radius: 999px;
          position: relative;
          overflow: hidden;
          background: rgba(0, 0, 0, 0.06);
          border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .fill {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            90deg,
            rgba(10, 160, 190, 0),
            rgba(10, 160, 190, 0.6),
            rgba(130, 80, 220, 0.6),
            rgba(10, 160, 190, 0)
          );
          transform: translateX(-70%);
          animation: flow 1.05s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }
        .glint {
          position: absolute;
          inset: -30% -40%;
          background: linear-gradient(
            110deg,
            transparent 0%,
            rgba(255, 255, 255, 0.6) 22%,
            rgba(255, 255, 255, 0.9) 28%,
            transparent 40%
          );
          transform: translateX(-55%);
          animation: glint 1.05s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
          mix-blend-mode: overlay;
        }

        @keyframes flow {
          0% {
            transform: translateX(-75%);
            opacity: 0.8;
          }
          50% {
            opacity: 1;
          }
          100% {
            transform: translateX(75%);
            opacity: 0.8;
          }
        }
        @keyframes glint {
          0% {
            transform: translateX(-60%);
            opacity: 0;
          }
          20% {
            opacity: 1;
          }
          100% {
            transform: translateX(60%);
            opacity: 0;
          }
        }

        @keyframes gradientShift {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }

        @keyframes breathe {
          0%, 100% {
            transform: scale(1);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.6), 0 0 15px rgba(59, 130, 246, 0.3);
          }
          50% {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.9), 0 0 25px rgba(59, 130, 246, 0.6);
          }
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        .todo-list {
          margin: 10px 0 12px 22px;
          display: flex;
          flex-direction: column;
          gap: 0;
        }
        .todo-item {
          display: flex;
          align-items: center;
          gap: 8px;
          height: 22px;
          color: rgba(0, 0, 0, 0.55);
        }
        .check-box {
          width: 14px;
          height: 14px;
          border-radius: 4px;
          border: 1px solid rgba(0, 0, 0, 0.3);
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }
        .check-box.done {
          background: transparent;
          border-color: transparent;
        }
        .check-box.done::after {
          content: "";
          width: 4px;
          height: 8px;
          border: solid #8b5cf6;
          border-width: 0 2px 2px 0;
          transform: rotate(45deg) translate(-0.5px, -1px);
          animation: tickGlow 3s ease-in-out infinite;
        }
        @keyframes tickGlow {
          0%, 100% { filter: drop-shadow(0 0 2px rgba(139, 92, 246, 0.6)); }
          50% { filter: drop-shadow(0 0 5px rgba(139, 92, 246, 1)); }
        }
        .loading-circle {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          border: 2px solid rgba(139, 92, 246, 0.3);
          border-top-color: #8b5cf6;
          animation: spin 1s linear infinite;
          display: inline-block;
          box-sizing: border-box;
        }

        .tree {
          position: relative;
          margin: 0 0 12px 4px;
          --cycle: 17s;
        }
        /* trunk: from the > prompt down to the FIRST elbow */
        .tree::before {
          content: "";
          position: absolute;
          left: 0;
          top: -94px;
          height: 105px;
          width: 1px;
          background: rgba(0, 0, 0, 0.22);
          transform-origin: top;
          animation: drawTrunk var(--cycle) ease infinite;
        }
        .tree-item {
          position: relative;
          padding-left: 18px;
          height: 22px;
          display: flex;
          align-items: center;
          gap: 8px;
          color: rgba(0, 0, 0, 0.55);
        }
        /* horizontal elbow on each item */
        .tree-item::after {
          content: "";
          position: absolute;
          left: 0;
          top: 50%;
          width: 18px;
          height: 1px;
          background: rgba(0, 0, 0, 0.22);
        }
        /* connector: from the first elbow down to the second elbow
           (only exists with the second branch, so no dangling stub) */
        .tree-item.last::before {
          content: "";
          position: absolute;
          left: 0;
          top: -11px;
          height: 22px;
          width: 1px;
          background: rgba(0, 0, 0, 0.22);
          transform-origin: top;
          animation: drawConnector var(--cycle) ease infinite;
        }

        /* ---- reveal, hold ~10s, then go away, looping ---- */
        .m-word {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          vertical-align: bottom;
          flex-shrink: 0;
          width: 0;
        }
        .tree-item:first-child::after {
          transform-origin: left;
          animation: drawElbow1 var(--cycle) ease infinite;
        }
        .tree-item:first-child .loader {
          animation: fadeLoader1 var(--cycle) ease infinite;
        }
        .tree-item:first-child .m-word {
          animation: typeWord1 var(--cycle) linear infinite;
        }
        .tree-item.last::after {
          transform-origin: left;
          animation: drawElbow2 var(--cycle) ease infinite;
        }
        .tree-item.last .loader {
          animation: fadeLoader2 var(--cycle) ease infinite;
        }
        .tree-item.last .m-word {
          animation: typeWord2 var(--cycle) linear infinite;
        }

        @keyframes drawTrunk {
          0% { transform: scaleY(0); }
          2% { transform: scaleY(1); }
          97% { transform: scaleY(1); }
          98.5%, 100% { transform: scaleY(0); }
        }
        @keyframes drawElbow1 {
          0%, 2% { transform: scaleX(0); }
          4% { transform: scaleX(1); }
          95.5% { transform: scaleX(1); }
          97%, 100% { transform: scaleX(0); }
        }
        @keyframes fadeLoader1 {
          0%, 4% { opacity: 0; }
          6% { opacity: 1; }
          94% { opacity: 1; }
          95.5%, 100% { opacity: 0; }
        }
        @keyframes typeWord1 {
          0% { width: 0; }
          6% { width: 0; animation-timing-function: steps(16, end); }
          12% { width: 16ch; }
          92% { width: 16ch; }
          94% { width: 0; }
          100% { width: 0; }
        }
        @keyframes drawConnector {
          0%, 12% { transform: scaleY(0); }
          14% { transform: scaleY(1); }
          90% { transform: scaleY(1); }
          92%, 100% { transform: scaleY(0); }
        }
        @keyframes drawElbow2 {
          0%, 14% { transform: scaleX(0); }
          16% { transform: scaleX(1); }
          88% { transform: scaleX(1); }
          90%, 100% { transform: scaleX(0); }
        }
        @keyframes fadeLoader2 {
          0%, 16% { opacity: 0; }
          18% { opacity: 1; }
          86% { opacity: 1; }
          88%, 100% { opacity: 0; }
        }
        @keyframes typeWord2 {
          0% { width: 0; }
          18% { width: 0; animation-timing-function: steps(16, end); }
          24% { width: 16ch; }
          84% { width: 16ch; }
          86% { width: 0; }
          100% { width: 0; }
        }
    </style>
</head>
<body>

    <!-- From Uiverse.io by egehan_1415 --> 
    <div class="ui-loader term" role="status" aria-label="Loading">
      <div class="term-body">
        <div class="line"><b>></b> npm run build</div>

        <div class="todo-list">
          <div class="todo-item">
            <span class="check-box done"></span>
            <span>task 1</span>
          </div>
          <div class="todo-item">
            <span class="loading-circle"></span>
            <span>task 2</span>
          </div>
          <div class="todo-item">
            <span class="check-box"></span>
            <span>task 3</span>
          </div>
        </div>

        <div class="tree">
          <div class="tree-item">
            <div class="loader">
              <div class="orbe" style="--index: 0"></div>
              <div class="orbe" style="--index: 1"></div>
              <div class="orbe" style="--index: 2"></div>
              <div class="orbe" style="--index: 3"></div>
              <div class="orbe" style="--index: 4"></div>
            </div>
            <span class="m-word">minion activated</span>
          </div>
          <div class="tree-item last">
            <div class="loader">
              <div class="orbe" style="--index: 0"></div>
              <div class="orbe" style="--index: 1"></div>
              <div class="orbe" style="--index: 2"></div>
              <div class="orbe" style="--index: 3"></div>
              <div class="orbe" style="--index: 4"></div>
            </div>
            <span class="m-word">minion activated</span>
          </div>
        </div>

        <div class="progress">
          <span class="fill"></span>
          <span class="glint" aria-hidden="true"></span>
        </div>
      </div>
    </div>

</body>
</html>
