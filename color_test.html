<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Toggle</title>
    <style>
        :root {
            /* Layout box. Vertical now. */
            --orb-w: 32px;
            --orb-h: 140px;
            --core-w: 22px;
            --core-h: 130px;

            /* Indicator bar (vertical) */
            --bar-w: 16px;
            --bar-h: 46px;
            /* Rotating color disc inside the bar. Must be >= the bar's diagonal */
            --bg-size: 52px;

            --slide: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        /* wrapper to give the absolutely-positioned button a frame */
        .button-host {
            position: relative;
            width: var(--orb-w);
            height: var(--orb-h);
        }
        body.preview {
            background: #ffffff;
        }
        body.preview .button-host {
            transform: scale(4);
            transform-origin: center;
        }

        .stop-agent-button {
            position: absolute;
            left: 0;
            top: 50%;

            width: var(--orb-w);
            height: var(--orb-h);
            flex-shrink: 0;

            background: transparent;
            border-radius: 999px;

            display: flex;
            align-items: center;
            justify-content: center;

            /* Initially Hidden */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            overflow: visible;
            z-index: 20;
        }

        .stop-agent-button.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .stop-agent-button.pop-vanish {
            animation: stopPopVanish 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            transition: none;
        }

        @keyframes stopPopVanish {
            0%   { transform: translateY(-50%) scale(1); opacity: 1; }
            35%  { transform: translateY(-50%) scale(1.3); opacity: 1; }
            100% { transform: translateY(-50%) scale(0); opacity: 0; }
        }

        .stop-orb {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;   /* children re-enable themselves */
        }

        /* Invisible track. Holds the two halves - no shape, no fill, no border. */
        .pill {
            position: absolute;
            inset: 0;
            margin: auto;
            width: var(--core-w);
            height: var(--core-h);
            box-sizing: border-box;
            background: transparent;
        }

        /* Two halves. Each: a click target area. */
        .segments {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 4;
        }
        .seg {
            flex: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        /* The lit bar. Slides to upper or lower half. */
        .glow-cell {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            transition: transform var(--slide);
        }
        .stop-agent-button.mode-mobile .glow-cell {
            transform: translateY(100%);
        }

        /* ---- the original orb effect, living in the bar ---- */
        .glow-bar {
            position: relative;
            width: var(--bar-w);
            height: var(--bar-h);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* white capsule core, clipping the spinning disc */
        .bar-core {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 999px;
            background-color: white;
            overflow: hidden;
            box-shadow: 0 0 2px 2px rgba(255,255,255,0.9);
        }
        .blur-ball {
            position: absolute;
            border-radius: 50%;
            filter: blur(6px);
            z-index: 2;
        }
        .ball-1 {
            background: #ff0073; width: 8px; height: 8px; top: 10%; left: 10%;
            animation: floatBall1 4s ease-in-out infinite alternate;
        }
        .ball-2 {
            background: #00bbff; width: 6px; height: 6px; top: 70%; left: 40%;
            animation: floatBall2 5s ease-in-out infinite alternate;
        }
        .ball-3 {
            background: #ffdd00; width: 7px; height: 7px; top: 40%; left: 20%;
            animation: floatBall3 4.5s ease-in-out infinite alternate;
        }

        @keyframes floatBall1 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(6px, 15px) scale(1.2); }
            66% { transform: translate(-2px, 25px) scale(0.8); }
            100% { transform: translate(4px, 35px) scale(1.1); }
        }
        @keyframes floatBall2 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-5px, -15px) scale(1.3); }
            66% { transform: translate(4px, -25px) scale(0.9); }
            100% { transform: translate(-2px, -35px) scale(1); }
        }
        @keyframes floatBall3 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(4px, 12px) scale(0.8); }
            66% { transform: translate(-3px, -12px) scale(1.3); }
            100% { transform: translate(5px, 15px) scale(1.1); }
        }

        .stop-bg {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--bg-size);
            height: var(--bg-size);
            margin-left: calc(var(--bg-size) / -2);
            margin-top: calc(var(--bg-size) / -2);
            border-radius: 50%;
            background-color: #9292d8;
            animation: stop-bgRotate 2.5s linear infinite;
            z-index: 1;
        }
        .stop-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            animation: stop-bgColor 4s linear infinite;
            opacity: 0.2;
        }

        /* inner white rim - own layer, an inset shadow on .bar-core would paint
           under .stop-bg and never show */
        .stop-rim {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 2px 1px rgba(255,255,255,0.6);
            z-index: 3;
            pointer-events: none;
        }

        /* While sliding, the bar stretches like it's accelerating, then squashes
           and settles on landing. Driven by the .moving class from setMode. */
        .stop-agent-button.moving .glow-bar {
            animation: bar-travel 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes bar-travel {
            0%   { transform: scaleY(1); }
            35%  { transform: scaleY(1.5); }
            70%  { transform: scaleY(0.85); }
            100% { transform: scaleY(1); }
        }

        @keyframes stop-bgRotate {
            0%   { transform: rotate(0deg); }
            20%  { transform: rotate(90deg); }
            40%  { transform: rotate(180deg) scale(0.95,1); }
            60%, 100% { transform: rotate(360deg); }
        }
        @keyframes stop-bgColor {
            20% { background-color: red; }
            40% { background-color: #5eff7e; }
            60% { background-color: #2cb5ff; }
            80% { background-color: #fc63ff; }
        }
    </style>
</head>
<body>
    <div class="button-host">
        <div class="stop-agent-button mode-computer" id="stopAgentBtn">
            <div class="stop-orb">
                <div class="pill">
                    <div class="segments">
                        <div class="seg" data-mode="computer"></div>
                        <div class="seg" data-mode="mobile"></div>
                    </div>

                    <div class="glow-cell">
                        <div class="glow-bar">
                            <div class="bar-core">
                                <div class="stop-bg"></div>
                                <div class="blur-ball ball-1"></div>
                                <div class="blur-ball ball-2"></div>
                                <div class="blur-ball ball-3"></div>
                                <div class="stop-rim"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stopBtn = document.getElementById('stopAgentBtn');

        // ---- DESIGN MODE ----------------------------------------------------
        // Set to false (or delete this and the `|| FORCE_PREVIEW` below) when you
        // drop this file back into the app. While it's true it is always shown and
        // zoomed 4x so we can actually see what we're editing.
        const FORCE_PREVIEW = true;
        // ---------------------------------------------------------------------

        // window.parent === window means the file was opened directly (not embedded).
        const standalone = FORCE_PREVIEW || window.parent === window;

        if (standalone) {
            document.body.classList.add('preview');
            stopBtn.classList.add('active');
        }

        // 'computer' | 'mobile'. The class drives the slide; no JS geometry.
        let moveTimer = null;
        function setMode(mode, notify = true) {
            const changed = (mode === 'mobile') !== stopBtn.classList.contains('mode-mobile');
            stopBtn.classList.toggle('mode-mobile', mode === 'mobile');
            stopBtn.classList.toggle('mode-computer', mode !== 'mobile');
            if (changed) {
                // Restart the travel stretch even on rapid re-toggles.
                clearTimeout(moveTimer);
                stopBtn.classList.remove('moving');
                void stopBtn.offsetWidth;   // force reflow so the animation replays
                stopBtn.classList.add('moving');
                moveTimer = setTimeout(() => stopBtn.classList.remove('moving'), 450);
            }
            if (notify && !standalone) parent.postMessage('pcbtn:mode:' + mode, '*');
        }

        document.querySelectorAll('.seg').forEach(seg => {
            seg.addEventListener('click', () => setMode(seg.dataset.mode));
        });

        // Expand a little, then completely vanish (and reset so it can show again later).
        function vanish() {
            if (!stopBtn.classList.contains('active')) return;
            if (stopBtn.classList.contains('pop-vanish')) return;
            stopBtn.classList.add('pop-vanish');
            setTimeout(() => stopBtn.classList.remove('active', 'pop-vanish'), 600);
        }

        // Commands from the parent app.
        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (msg === 'pcbtn:show') {
                stopBtn.classList.remove('pop-vanish');
                stopBtn.classList.add('active');
            } else if (msg === 'pcbtn:vanish') {
                vanish();
            } else if (msg === 'pcbtn:hide') {
                stopBtn.classList.remove('active', 'pop-vanish');
            } else if (msg === 'pcbtn:mode:computer') {
                setMode('computer', false);
            } else if (msg === 'pcbtn:mode:mobile') {
                setMode('mobile', false);
            }
        });
    </script>
</body>
</html>
