<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Button</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        /* wrapper to give the absolutely-positioned button a frame */
        .button-host {
            position: relative;
            width: 42px;
            height: 42px;
        }
        /* Standalone preview only (file opened directly, not embedded in an iframe):
           zoom the orb up so it's big and easy to see/edit. Inside the app it renders
           at its true 42px size. */
        body.preview .button-host {
            transform: scale(6);
            transform-origin: center;
        }

        .stop-agent-button {
            position: absolute;
            right: 6px;
            top: 50%;

            width: 42px;
            height: 42px;
            flex-shrink: 0;

            background: transparent;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;

            /* Initially Hidden */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            overflow: visible; /* Allow glow to show */
            z-index: 20;
        }

        .stop-agent-button.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .stop-agent-button.pop-vanish {
            animation: stopPopVanish 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            transition: none;
        }

        @keyframes stopPopVanish {
            0%   { transform: translateY(-50%) scale(1); opacity: 1; }
            35%  { transform: translateY(-50%) scale(1.3); opacity: 1; }
            100% { transform: translateY(-50%) scale(0); opacity: 0; }
        }

        .stop-orb {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .stop-circle-1 {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            position: absolute;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: stop-pulse 4.2s ease-in-out infinite 0.3s;
            z-index: 1;
        }
        .stop-circle-1::before,
        .stop-circle-1::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            width: 30%;
            height: 30%;
        }
        .stop-circle-1::before { background: #ff0073; top: 30%; right: 30%; }
        .stop-circle-1::after { background: #00baff; bottom: 10%; left: 30%; }

        .stop-circle-2 {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            position: absolute;
            inset: 0;
            margin: auto;
            background-color: white;
            z-index: 9;
            animation: stop-pulse2 4.2s ease-in-out infinite;
        }
        .stop-circle-2::before,
        .stop-circle-2::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(6px);
            z-index: 1;
        }
        .stop-circle-2::before { background: #ff0073; width: 30%; height: 30%; top: 20%; right: 20%; }
        .stop-circle-2::after { background: #00bbff; width: 20%; height: 20%; bottom: 10%; left: 40%; }

        .stop-bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 5px 2px rgba(255,255,255,0.8), 0 0 2px 2px rgba(255,255,255,0.9);
            background-color: #9292d8;
            animation: stop-bgRotate 2.5s linear infinite;
        }
        .stop-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            animation: stop-bgColor 4s linear infinite;
            box-shadow: inset 0 0 5px 2px rgba(255,255,255,0.8);
            opacity: 0.2;
        }

        .stop-pc {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 64px;
            height: 64px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            gap: 2px;
        }
        .stop-monitor {
            width: 24px;
            height: 20px;
            background: transparent;
            border-radius: 2px;
            padding: 0;
            border: 2px solid white;
            box-sizing: border-box;
            box-shadow: none;
        }
        .stop-screen {
            width: 100%;
            height: 100%;
            background-color: transparent;
            border-radius: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Scaled up internals ensure layout uses whole numbers (no sub-pixel rounding), 
               keeping the eyes perfectly symmetric at any zoom level. */
            gap: 4px;
            box-shadow: none;
        }
        .stop-eye {
            width: 3px;
            height: 6px;
            border-radius: 2px;
            background: white;
            position: relative;
            top: -2px;
            animation: stop-blink 4s infinite;
        }
        .stop-base {
            width: 32px;
            height: 2px;
            background: white;
            border-radius: 1px;
        }

        @keyframes stop-pulse {
            0%   { transform: scale(0.97); }
            15%  { transform: scale(1); }
            30%  { transform: scale(0.98); }
            45%  { transform: scale(1); }
            60%  { transform: scale(0.97); }
            85%  { transform: scale(1); }
            100% { transform: scale(0.97); }
        }
        @keyframes stop-pulse2 {
            0%   { transform: scale(1); }
            15%  { transform: scale(1.03); }
            30%  { transform: scale(0.98); }
            45%  { transform: scale(1.04); }
            60%  { transform: scale(0.97); }
            85%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        @keyframes stop-bgRotate {
            0%   { transform: rotate(0deg); }
            20%  { transform: rotate(90deg); }
            40%  { transform: rotate(180deg) scale(0.95,1); }
            60%, 100% { transform: rotate(360deg); }
        }
        @keyframes stop-bgColor {
            20% { background-color: red; }
            40% { background-color: #5eff7e; }
            60% { background-color: #2cb5ff; }
            80% { background-color: #fc63ff; }
        }
        @keyframes stop-blink {
            0%, 85%, 100% { transform: scaleY(1); }
            92% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>
    <div class="button-host">
        <!-- Stop Agent Orb Button (Hidden by default) -->
        <div class="stop-agent-button" id="stopAgentBtn" title="Stop Agent">
            <div class="stop-orb">
                <div class="stop-circle-1"></div>
                <div class="stop-circle-2"><div class="stop-bg"></div></div>
                <div class="stop-pc">
                    <div class="stop-monitor"><div class="stop-screen"><div class="stop-eye"></div><div class="stop-eye"></div></div></div>
                    <div class="stop-base"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stopBtn = document.getElementById('stopAgentBtn');
        // window.parent === window means the file was opened directly (not embedded) -> preview mode.
        const standalone = window.parent === window;
        if (standalone) {
            document.body.classList.add('preview');  // big zoom
            stopBtn.classList.add('active');         // show it so the preview isn't blank
        }

        // Expand a little, then completely vanish (and reset so it can show again later).
        function vanish() {
            // Only vanish something that's actually showing. Prevents a "ghost pop":
            // after a manual stop the backend also calls agentComplete -> another vanish,
            // and the pop-vanish keyframe (opacity:1 at its start) would flash the
            // already-hidden orb back into view.
            if (!stopBtn.classList.contains('active')) return;
            if (stopBtn.classList.contains('pop-vanish')) return;
            stopBtn.classList.add('pop-vanish');
            setTimeout(() => stopBtn.classList.remove('active', 'pop-vanish'), 600);
        }

        // Click the orb: play the vanish, and (when embedded) tell the parent app to stop the agent.
        stopBtn.addEventListener('click', () => {
            if (stopBtn.classList.contains('pop-vanish')) return;
            vanish();
            if (!standalone) parent.postMessage('pcbtn:clicked', '*');
        });

        // Commands from the parent app.
        window.addEventListener('message', (e) => {
            if (e.data === 'pcbtn:show') {
                stopBtn.classList.remove('pop-vanish');
                stopBtn.classList.add('active');
            } else if (e.data === 'pcbtn:vanish') {
                vanish();
            } else if (e.data === 'pcbtn:hide') {
                stopBtn.classList.remove('active', 'pop-vanish');
            }
        });
    </script>
</body>
</html>
