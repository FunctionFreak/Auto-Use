<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Collapse Loader</title>
    <style>
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    
    <!-- Canvas for the Particle Engine -->
    <canvas id="loaderCanvas"></canvas>

    <script>
        const canvas = document.getElementById('loaderCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, cx, cy;
        let particles = [];
        
        // --- System Configuration ---
        const OUTER_SPOKES = 12;
        const INNER_SPOKES = 8;
        const PARTICLES_PER_SPOKE = 40;
        const TOTAL_PARTICLES = (OUTER_SPOKES + INNER_SPOKES) * PARTICLES_PER_SPOKE; // 800 particles
        
        const GLOBE_RADIUS = 36;
        const TICK_RADIUS = 36;
        const PARTICLE_COLOR = '#9ca3af'; // Tailwind gray-400

        // Cursor (rounded arrow, no tail): tip, bottom-left, inner notch, right
        const CURSOR_PTS = [[-11, -27], [-11, 16], [2, 6], [20, 4]];     // points up-left
        const CURSOR_PIVOT_L = { x: -1, y: -4 };  // centroid -> pulses in place, no drift

        // Clock face, hands at 10:10
        const CLOCK_RADIUS = 32;
        const _hourA = (10 + 10 / 60) * 30 * Math.PI / 180;
        const _minA = 10 * 6 * Math.PI / 180;
        const CLOCK_HOUR_END = { x: Math.sin(_hourA) * 16, y: -Math.cos(_hourA) * 16 };
        const CLOCK_MIN_END = { x: Math.sin(_minA) * 25, y: -Math.cos(_minA) * 25 };

        const PEN_LINE_REST = -26; // resting left-end x of the pen's top "writing" line

        // --- Timeline (shape order). To add a shape, drop its key into SEQ near the
        //     front and add its generator / getShapePos / vector branch. Timings and
        //     hold windows below recompute automatically. ---
        //
        // SHAPE KEY LEGEND (what each key in SEQ means — used by Claude Code to identify shapes):
        //   'replace'— replace: a horizontal code file; lines scroll up/down, then get replaced
        //   'grep'   — grep: search file content; a box cycles through the matching lines
        //   'glob'   — glob: match files by a "*" pattern; file cards light up as they match
        //   'coder'  — single AI head, blinking  =  the "coder"
        //   'minion' — three AI heads (a parent branching to two)  =  the "minion"
        //   'view'   — view file: a document with a magnifying glass scanning across it
        //
        // Dormant shapes (defined below but NOT in the loop — drop a key into SEQ to use):
        //   'l' loader · 'g' globe · 's' monitor · 'tr' node tree · 'sv' server rack
        //   't' tick/check · 'sh' apple terminal · 'cl' terminal · 'ck' clock
        //   'cu'/'cuR'/'cu3' cursor (double/single/triple click) · 'kb' keyboard · 'mo' mouse
        //   'pn' pen writing · 'cm' camera · 'dd' drag-and-drop · 'td' todo · 'tu' todo update
        //   'bk' book page-turn · 'ap' app box · 'pr' progress ring
        const SEQ = ['replace', 'grep', 'glob', 'coder', 'minion', 'view'];
        const TRANS_MS = 1500;          // morph time between shapes
        const SEGMENTS = [];            // built below: alternating hold / transition spans
        (function buildTimeline() {
            let tt = 0;
            for (let i = 0; i < SEQ.length; i++) {
                const cur = SEQ[i], next = SEQ[(i + 1) % SEQ.length];
                const holdLen = (cur === 'l') ? 2500 : 5000; // loader holds shorter
                SEGMENTS.push({ s1: cur, s2: cur, start: tt, end: tt + holdLen, isHold: true });
                tt += holdLen;
                SEGMENTS.push({ s1: cur, s2: next, start: tt, end: tt + TRANS_MS, isHold: false });
                tt += TRANS_MS;
            }
        })();
        const CYCLE_MS = SEGMENTS[SEGMENTS.length - 1].end; // full loop duration
        function holdWindow(name) {
            for (const s of SEGMENTS) if (s.isHold && s.s1 === name) return [s.start, s.end];
            return [0, 0];
        }
        // Precomputed hold windows for the animated shapes (used by their motion fns)
        const HOLD_BK = holdWindow('bk');
        const HOLD_AP = holdWindow('ap');
        const HOLD_PR = holdWindow('pr');
        const HOLD_DD = holdWindow('dd');
        const HOLD_TU = holdWindow('tu');
        const HOLD_PN = holdWindow('pn');
        const HOLD_CU = holdWindow('cu');
        const HOLD_CUR = holdWindow('cuR');
        const HOLD_CU3 = holdWindow('cu3');
        const HOLD_MO = holdWindow('mo');
        const HOLD_VIEW = holdWindow('view');
        const HOLD_GREP = holdWindow('grep');
        const HOLD_GLOB = holdWindow('glob');
        const HOLD_REPLACE = holdWindow('replace');

        // Handle window resizing
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Math Helper: Distance from a point to a line segment
        function distToSegment(p, v, w) {
            let l2 = (w.x - v.x)*(w.x - v.x) + (w.y - v.y)*(w.y - v.y);
            if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        // Generates the initial particle layout for the Tick shape
        function generateTickData(targetCount) {
            let bestData = [];
            let minDiff = Infinity;
            
            const p1 = {x: -14, y: 2};
            const p2 = {x: -4, y: 12};
            const p3 = {x: 16, y: -8};
            const CUTOUT_THICKNESS = 6.5; 

            for(let density = 0.8; density < 3.0; density += 0.01) {
                let temp = [];
                let rings = Math.floor(TICK_RADIUS * density);
                for(let i = 0; i <= rings; i++) {
                    let r = (i / rings) * TICK_RADIUS;
                    let pts = i === 0 ? 1 : Math.floor(2 * Math.PI * r * density);
                    for(let j = 0; j < pts; j++) {
                        let theta = (j / pts) * Math.PI * 2;
                        let px = r * Math.cos(theta);
                        let py = r * Math.sin(theta);
                        
                        let d1 = distToSegment({x: px, y: py}, p1, p2);
                        let d2 = distToSegment({x: px, y: py}, p2, p3);
                        
                        if (d1 > CUTOUT_THICKNESS && d2 > CUTOUT_THICKNESS) {
                            temp.push({x: px, y: py});
                        }
                    }
                }
                if (Math.abs(temp.length - targetCount) < minDiff) {
                    minDiff = Math.abs(temp.length - targetCount);
                    bestData = temp;
                    if (minDiff === 0) break;
                }
            }
            while(bestData.length > targetCount) bestData.splice(Math.floor(Math.random() * bestData.length), 1);
            while(bestData.length < targetCount) bestData.push({x: bestData[0].x, y: bestData[0].y});
            
            return bestData;
        }

        // Helper: Generate PC Screen Positions
        function generateScreenData(targetCount) {
            let data = [];
            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();
                let noise = () => (Math.random() * 4 - 2); 
                
                if (r < 0.28) { // Top edge
                    data.push({ x: -35 + Math.random() * 70, y: -25 + noise() });
                } else if (r < 0.56) { // Bottom edge
                    data.push({ x: -35 + Math.random() * 70, y: 20 + noise() });
                } else if (r < 0.74) { // Left edge
                    data.push({ x: -35 + noise(), y: -25 + Math.random() * 45 });
                } else if (r < 0.92) { // Right edge
                    data.push({ x: 35 + noise(), y: -25 + Math.random() * 45 });
                } else if (r < 0.96) { // Stand neck
                    data.push({ x: -6 + Math.random() * 12, y: 20 + Math.random() * 10 });
                } else { // Stand base plate
                    data.push({ x: -20 + Math.random() * 40, y: 30 + Math.random() * 6 });
                }
            }
            return data;
        }

        // Helper: Generate Node Tree Positions
        function generateTreeData(targetCount) {
            let data = [];
            const nodes = [
                {id: 0, x: 0, y: -25},   // Root
                {id: 1, x: -20, y: 0},   // L1 Left
                {id: 2, x: 20, y: 0},    // L1 Right
                {id: 3, x: -35, y: 25},  // L2 Left child 1
                {id: 4, x: -20, y: 25},  // L2 Left child 2
                {id: 5, x: -5, y: 25},   // L2 Left child 3
                {id: 6, x: 5, y: 25},    // L2 Right child 1
                {id: 7, x: 20, y: 25},   // L2 Right child 2
                {id: 8, x: 35, y: 25}    // L2 Right child 3
            ];
            const edges = [
                [0, 1], [0, 2],
                [1, 3], [1, 4], [1, 5],
                [2, 6], [2, 7], [2, 8]
            ];

            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();
                if (r < 0.4) { 
                    // 40% of particles form the circular nodes
                    let node = nodes[Math.floor(Math.random() * nodes.length)];
                    let angle = Math.random() * Math.PI * 2;
                    let rad = Math.sqrt(Math.random()) * 4.5; 
                    data.push({ x: node.x + Math.cos(angle) * rad, y: node.y + Math.sin(angle) * rad });
                } else { 
                    // 60% of particles form the connecting branches
                    let edge = edges[Math.floor(Math.random() * edges.length)];
                    let n1 = nodes[edge[0]];
                    let n2 = nodes[edge[1]];
                    let t = Math.random();
                    let noiseX = (Math.random() - 0.5) * 2;
                    let noiseY = (Math.random() - 0.5) * 2;
                    data.push({ 
                        x: n1.x + (n2.x - n1.x) * t + noiseX, 
                        y: n1.y + (n2.y - n1.y) * t + noiseY 
                    });
                }
            }
            return data;
        }

        // Helper: Generate Server Rack Positions
        function generateServerData(targetCount) {
            let data = [];
            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();
                let noise = () => (Math.random() * 2 - 1); 

                if (r < 0.18) { // Left edge
                    data.push({ x: -25 + noise(), y: -35 + Math.random() * 70 });
                } else if (r < 0.36) { // Right edge
                    data.push({ x: 25 + noise(), y: -35 + Math.random() * 70 });
                } else if (r < 0.46) { // Top edge
                    data.push({ x: -25 + Math.random() * 50, y: -35 + noise() });
                } else if (r < 0.56) { // Bottom edge
                    data.push({ x: -25 + Math.random() * 50, y: 35 + noise() });
                } else if (r < 0.68) { // Divider 1
                    data.push({ x: -25 + Math.random() * 50, y: -12 + noise() });
                } else if (r < 0.80) { // Divider 2
                    data.push({ x: -25 + Math.random() * 50, y: 12 + noise() });
                } else { // Details (lights and drive slots)
                    let blade = Math.floor(Math.random() * 3); // 3 server blades
                    let yCenter = blade === 0 ? -23.5 : (blade === 1 ? 0 : 23.5);
                    if (Math.random() < 0.2) { // Status light
                        data.push({ x: -15 + noise(), y: yCenter + noise() });
                    } else { // Drive slot line
                        data.push({ x: -5 + Math.random() * 20, y: yCenter + noise() });
                    }
                }
            }
            return data;
        }

        // Helper: Generate "coder" Positions (single AI head)
        function generateCoderData(targetCount) {
            let data = [];
            // Skeleton segments for the pill-shaped eyes
            const eyeL = { p1: {x: -8, y: -8}, p2: {x: -8, y: -2} };
            const eyeR = { p1: {x: 8, y: -8}, p2: {x: 8, y: -2} };
            
            while(data.length < targetCount) {
                let x = -30 + Math.random() * 60;
                let y = -30 + Math.random() * 60;
                
                // Cut out rounded corners (Radius 13px)
                let cornerDist = 0;
                let inCorner = false;
                if (x < -17 && y < -17) { cornerDist = Math.hypot(x + 17, y + 17); inCorner = true; }
                else if (x > 17 && y < -17) { cornerDist = Math.hypot(x - 17, y + 17); inCorner = true; }
                else if (x < -17 && y > 17) { cornerDist = Math.hypot(x + 17, y - 17); inCorner = true; }
                else if (x > 17 && y > 17) { cornerDist = Math.hypot(x - 17, y - 17); inCorner = true; }
                
                if (inCorner && cornerDist > 13) continue;
                
                // Cut out negative space for the eyes
                let dL = distToSegment({x: x, y: y}, eyeL.p1, eyeL.p2);
                let dR = distToSegment({x: x, y: y}, eyeR.p1, eyeR.p2);
                if (dL < 4 || dR < 4) continue;
                
                data.push({x: x, y: y});
            }
            return data;
        }

        // Sample points filling the "coder" head (rounded square, eye holes cut out).
        function sampleHeadPoints(count) {
            let data = [];
            const eyeL = { p1: { x: -8, y: -8 }, p2: { x: -8, y: -2 } };
            const eyeR = { p1: { x: 8, y: -8 }, p2: { x: 8, y: -2 } };
            while (data.length < count) {
                let x = -30 + Math.random() * 60;
                let y = -30 + Math.random() * 60;
                let inCorner = false, cornerDist = 0;
                if (x < -17 && y < -17) { cornerDist = Math.hypot(x + 17, y + 17); inCorner = true; }
                else if (x > 17 && y < -17) { cornerDist = Math.hypot(x - 17, y + 17); inCorner = true; }
                else if (x < -17 && y > 17) { cornerDist = Math.hypot(x + 17, y - 17); inCorner = true; }
                else if (x > 17 && y > 17) { cornerDist = Math.hypot(x - 17, y - 17); inCorner = true; }
                if (inCorner && cornerDist > 13) continue;
                let dL = distToSegment({ x: x, y: y }, eyeL.p1, eyeL.p2);
                let dR = distToSegment({ x: x, y: y }, eyeR.p1, eyeR.p2);
                if (dL < 4 || dR < 4) continue;
                data.push({ x: x, y: y });
            }
            return data;
        }

        // Two short lines on the right of the head — angled up (dir 'up') or down.
        const HEAD_LINES_UP = [[34, 0, 46, -9], [34, 11, 46, 2]];
        const HEAD_LINES_DOWN = [[34, 0, 46, 9], [34, -11, 46, -2]];
        function linePoints(seg, n) {
            let pts = [];
            for (let i = 0; i < n; i++) {
                let t = i / (n - 1);
                pts.push({ x: seg[0] + (seg[2] - seg[0]) * t, y: seg[1] + (seg[3] - seg[1]) * t });
            }
            return pts;
        }
        function generateHeadWithLinesData(targetCount, dir) {
            const lines = dir === 'up' ? HEAD_LINES_UP : HEAD_LINES_DOWN;
            let data = [];
            lines.forEach(seg => { data = data.concat(linePoints(seg, 34)); });
            data = data.concat(sampleHeadPoints(targetCount - data.length));
            return data;
        }

        // Draw the "coder" head face (solid rounded square + blinking white eyes).
        function drawAIHeadFace(c, time) {
            c.fillStyle = PARTICLE_COLOR;
            c.beginPath();
            if (c.roundRect) c.roundRect(-30, -30, 60, 60, 13);
            else c.rect(-30, -30, 60, 60);
            c.fill();
            let blinkTime = time % 1800;
            let eyeScaleY = 1;
            if (blinkTime > 1620) {
                if (blinkTime < 1710) eyeScaleY = 1 - ((blinkTime - 1620) / 90) * 0.92;
                else eyeScaleY = 0.08 + ((blinkTime - 1710) / 90) * 0.92;
            }
            let eyeHeight = 14 * eyeScaleY;
            let eyeY = -5 - (eyeHeight / 2);
            let eyeRadius = Math.min(4, eyeHeight / 2);
            c.fillStyle = '#ffffff';
            c.beginPath();
            if (c.roundRect) {
                c.roundRect(-12, eyeY, 8, eyeHeight, eyeRadius);
                c.roundRect(4, eyeY, 8, eyeHeight, eyeRadius);
            } else {
                c.rect(-12, eyeY, 8, eyeHeight);
                c.rect(4, eyeY, 8, eyeHeight);
            }
            c.fill();
            c.fillStyle = PARTICLE_COLOR;
        }

        function drawHeadLines(c, dir) {
            const lines = dir === 'up' ? HEAD_LINES_UP : HEAD_LINES_DOWN;
            c.strokeStyle = PARTICLE_COLOR;
            c.lineCap = 'round';
            c.lineWidth = 3.2;
            lines.forEach(seg => { c.beginPath(); c.moveTo(seg[0], seg[1]); c.lineTo(seg[2], seg[3]); c.stroke(); });
        }

        // "minion": a branch with a small blinking head on each of three arms (parent + two).
        const AINODE = { left: [-24, 0], h1: [24, -20], h2: [24, 20], half: 12, l1: [-7, -4, 7, -16], l2: [-7, 4, 7, 16] };

        // Draw a small head (scaled "coder" head) with blinking eyes — used by the "minion".
        function drawSmallHead(c, cx, cy, half, time) {
            const k = half / 30;
            c.fillStyle = PARTICLE_COLOR;
            c.beginPath();
            if (c.roundRect) c.roundRect(cx - half, cy - half, 2 * half, 2 * half, 13 * k);
            else c.rect(cx - half, cy - half, 2 * half, 2 * half);
            c.fill();
            let blinkTime = time % 1800;
            let eyeScaleY = 1;
            if (blinkTime > 1620) {
                if (blinkTime < 1710) eyeScaleY = 1 - ((blinkTime - 1620) / 90) * 0.92;
                else eyeScaleY = 0.08 + ((blinkTime - 1710) / 90) * 0.92;
            }
            let eyeH = 14 * k * eyeScaleY;
            let eyeY = cy + (-5 * k) - eyeH / 2;
            let eyeR = Math.min(4 * k, eyeH / 2);
            c.fillStyle = '#ffffff';
            c.beginPath();
            if (c.roundRect) {
                c.roundRect(cx - 12 * k, eyeY, 8 * k, eyeH, eyeR);
                c.roundRect(cx + 4 * k, eyeY, 8 * k, eyeH, eyeR);
            } else {
                c.rect(cx - 12 * k, eyeY, 8 * k, eyeH);
                c.rect(cx + 4 * k, eyeY, 8 * k, eyeH);
            }
            c.fill();
            c.fillStyle = PARTICLE_COLOR;
        }

        // Rejection-sample points filling a small "minion" head (rounded square, eye holes).
        function sampleSmallHeadPoints(cx, cy, half, count) {
            const k = half / 30;
            const eyeL = { p1: { x: cx - 8 * k, y: cy - 8 * k }, p2: { x: cx - 8 * k, y: cy - 2 * k } };
            const eyeR = { p1: { x: cx + 8 * k, y: cy - 8 * k }, p2: { x: cx + 8 * k, y: cy - 2 * k } };
            let data = [], tries = 0;
            while (data.length < count && tries < count * 80) {
                tries++;
                let x = cx - half + Math.random() * 2 * half;
                let y = cy - half + Math.random() * 2 * half;
                let lx = x - cx, ly = y - cy, inCorner = false, cd = 0;
                if (lx < -17 * k && ly < -17 * k) { cd = Math.hypot(lx + 17 * k, ly + 17 * k); inCorner = true; }
                else if (lx > 17 * k && ly < -17 * k) { cd = Math.hypot(lx - 17 * k, ly + 17 * k); inCorner = true; }
                else if (lx < -17 * k && ly > 17 * k) { cd = Math.hypot(lx + 17 * k, ly - 17 * k); inCorner = true; }
                else if (lx > 17 * k && ly > 17 * k) { cd = Math.hypot(lx - 17 * k, ly - 17 * k); inCorner = true; }
                if (inCorner && cd > 13 * k) continue;
                if (distToSegment({ x: x, y: y }, eyeL.p1, eyeL.p2) < 4 * k) continue;
                if (distToSegment({ x: x, y: y }, eyeR.p1, eyeR.p2) < 4 * k) continue;
                data.push({ x: x, y: y });
            }
            while (data.length < count) data.push({ x: cx, y: cy });
            return data;
        }

        function generateMinionData(targetCount) {
            let data = [];
            data = data.concat(linePoints(AINODE.l1, 50));
            data = data.concat(linePoints(AINODE.l2, 50));
            let rem = targetCount - data.length;
            let per = Math.floor(rem / 3);
            data = data.concat(sampleSmallHeadPoints(AINODE.left[0], AINODE.left[1], AINODE.half, per));
            data = data.concat(sampleSmallHeadPoints(AINODE.h1[0], AINODE.h1[1], AINODE.half, per));
            data = data.concat(sampleSmallHeadPoints(AINODE.h2[0], AINODE.h2[1], AINODE.half, targetCount - data.length));
            return data;
        }

        // Helper: Generate CLI Shell Positions (Now with flawless Apple Logo)
        function generateShellData(targetCount) {
            let data = [];
            
            // Apple logo (verified SVG glyph, viewBox 0 0 24 24, centered at 12,12)
            const applePath = new Path2D("M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z");
            
            // Render to off-screen canvas to reliably get perfectly distributed particles
            const size = 50;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

            tempCtx.fillStyle = '#000';
            tempCtx.translate(size/2, size/2); // Move to center
            tempCtx.scale(1.3, 1.3); // Scale up logo
            tempCtx.translate(-12, -12); // Shift path origin to center it
            tempCtx.fill(applePath);

            const imgData = tempCtx.getImageData(0, 0, size, size).data;
            let applePixels = [];
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (imgData[(y * size + x) * 4 + 3] > 128) { // If pixel is opaque
                        applePixels.push({ x: x - size/2, y: y - size/2 });
                    }
                }
            }

            // Chevron ">" prompt at the TOP-LEFT (matches shell)
            const chTop = { x: -26, y: -9 };
            const chTip = { x: -21, y: -5 };
            const chBot = { x: -26, y: -1 };
            const onSeg = (a, b) => {
                let t = Math.random();
                return { x: a.x + (b.x - a.x) * t + (Math.random() - 0.5) * 1.6,
                         y: a.y + (b.y - a.y) * t + (Math.random() - 0.5) * 1.6 };
            };

            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();
                let noise = () => (Math.random() * 2 - 1);

                if (r < 0.14) { // Top edge
                    data.push({ x: -35 + Math.random() * 70, y: -25 + noise() });
                } else if (r < 0.28) { // Bottom edge
                    data.push({ x: -35 + Math.random() * 70, y: 25 + noise() });
                } else if (r < 0.37) { // Left edge
                    data.push({ x: -35 + noise(), y: -25 + Math.random() * 50 });
                } else if (r < 0.46) { // Right edge
                    data.push({ x: 35 + noise(), y: -25 + Math.random() * 50 });
                } else if (r < 0.56) { // Top bar separator
                    data.push({ x: -35 + Math.random() * 70, y: -15 + noise() });
                } else if (r < 0.68) { // ">" prompt chevron
                    data.push(Math.random() < 0.5 ? onSeg(chTop, chTip) : onSeg(chTip, chBot));
                } else { 
                    // Pick a random valid pixel from the Apple logo
                    if (applePixels.length > 0) {
                        let p = applePixels[Math.floor(Math.random() * applePixels.length)];
                        // Shift it slightly down to center inside the terminal content area
                        data.push({ x: p.x + Math.random() - 0.5, y: p.y + 4 + Math.random() - 0.5 });
                    } else {
                        // Fallback just in case canvas failed to render
                        data.push({ x: noise(), y: noise() });
                    }
                }
            }
            return data;
        }

        // Helper: Generate Terminal Shell Positions (">" prompt + three text lines)
        function generateTerminalData(targetCount) {
            let data = [];
            const noise = () => (Math.random() * 2 - 1);
            const onSeg = (x1, y1, x2, y2, sp) => {
                let t = Math.random();
                return { x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * sp,
                         y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * sp };
            };

            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();

                if (r < 0.15) { // Top edge
                    data.push({ x: -35 + Math.random() * 70, y: -25 + noise() });
                } else if (r < 0.30) { // Bottom edge
                    data.push({ x: -35 + Math.random() * 70, y: 25 + noise() });
                } else if (r < 0.40) { // Left edge
                    data.push({ x: -35 + noise(), y: -25 + Math.random() * 50 });
                } else if (r < 0.50) { // Right edge
                    data.push({ x: 35 + noise(), y: -25 + Math.random() * 50 });
                } else if (r < 0.60) { // Top bar separator
                    data.push({ x: -35 + Math.random() * 70, y: -15 + noise() });
                } else if (r < 0.70) { // ">" prompt chevron
                    data.push(Math.random() < 0.5
                        ? onSeg(-26, -9, -21, -5, 1.6)   // upper stroke
                        : onSeg(-21, -5, -26, -1, 1.6)); // lower stroke
                } else if (r < 0.80) { // Line 1 (next to prompt)
                    data.push(onSeg(-16, -5, 14, -5, 1.6));
                } else if (r < 0.90) { // Line 2
                    data.push(onSeg(-26, 5, 20, 5, 1.6));
                } else { // Line 3
                    data.push(onSeg(-26, 15, 4, 15, 1.6));
                }
            }
            return data;
        }

        // Helper: Generate Cursor Positions (fills the rounded arrow shape for given points)
        function generateCursorData(targetCount, pts) {
            let data = [];
            const size = 80;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tc = tempCanvas.getContext('2d', { willReadFrequently: true });

            // Draw the same rounded cursor used by the vector (fill + round-join stroke)
            tc.translate(size / 2, size / 2);
            tc.fillStyle = '#000';
            tc.strokeStyle = '#000';
            tc.lineWidth = 6;
            tc.lineJoin = 'round';
            tc.lineCap = 'round';
            tc.beginPath();
            tc.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) tc.lineTo(pts[i][0], pts[i][1]);
            tc.closePath();
            tc.fill();
            tc.stroke();

            const imgData = tc.getImageData(0, 0, size, size).data;
            let pixels = [];
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (imgData[(y * size + x) * 4 + 3] > 128) {
                        pixels.push({ x: x - size / 2, y: y - size / 2 });
                    }
                }
            }

            for (let i = 0; i < targetCount; i++) {
                if (pixels.length > 0) {
                    let p = pixels[Math.floor(Math.random() * pixels.length)];
                    data.push({ x: p.x + Math.random() - 0.5, y: p.y + Math.random() - 0.5 });
                } else {
                    data.push({ x: 0, y: 0 });
                }
            }
            return data;
        }

        // Helper: Generate Clock Positions (face ring, 12 ticks, hour + minute hands)
        function generateClockData(targetCount) {
            let data = [];
            const onSeg = (x1, y1, x2, y2, sp) => {
                let t = Math.random();
                return { x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * sp,
                         y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * sp };
            };
            for (let i = 0; i < targetCount; i++) {
                let r = Math.random();
                if (r < 0.42) { // Face ring
                    let a = Math.random() * Math.PI * 2;
                    let rad = CLOCK_RADIUS + (Math.random() - 0.5) * 1.6;
                    data.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad });
                } else if (r < 0.66) { // 12 hour ticks
                    let h = Math.floor(Math.random() * 12);
                    let a = h * 30 * Math.PI / 180;
                    let dx = Math.sin(a), dy = -Math.cos(a);
                    let rr = 28 + Math.random() * 3.5;
                    data.push({ x: dx * rr + (Math.random() - 0.5) * 1.2, y: dy * rr + (Math.random() - 0.5) * 1.2 });
                } else if (r < 0.82) { // Hour hand
                    data.push(onSeg(0, 0, CLOCK_HOUR_END.x, CLOCK_HOUR_END.y, 1.8));
                } else { // Minute hand
                    data.push(onSeg(0, 0, CLOCK_MIN_END.x, CLOCK_MIN_END.y, 1.6));
                }
            }
            return data;
        }

        // Generic helper: render a shape into an off-screen canvas and sample its opaque pixels.
        function sampleShapePixels(size, drawFn) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const x = c.getContext('2d', { willReadFrequently: true });
            x.translate(size / 2, size / 2);
            x.fillStyle = '#000';
            x.strokeStyle = '#000';
            x.lineCap = 'round';
            x.lineJoin = 'round';
            drawFn(x);
            const d = x.getImageData(0, 0, size, size).data;
            let pts = [];
            for (let yy = 0; yy < size; yy++) {
                for (let xx = 0; xx < size; xx++) {
                    if (d[(yy * size + xx) * 4 + 3] > 128) pts.push({ x: xx - size / 2, y: yy - size / 2 });
                }
            }
            return pts;
        }

        function fillFromPixels(pixels, targetCount) {
            let data = [];
            for (let i = 0; i < targetCount; i++) {
                if (pixels.length > 0) {
                    let p = pixels[Math.floor(Math.random() * pixels.length)];
                    data.push({ x: p.x + Math.random() - 0.5, y: p.y + Math.random() - 0.5 });
                } else {
                    data.push({ x: 0, y: 0 });
                }
            }
            return data;
        }

        // Keyboard: body outline + 2 rows of 6 keys + spacebar. Shared by sampler and vector.
        const KEY_XS = [-27.5, -16.5, -5.5, 5.5, 16.5, 27.5];
        const KEY_YS = [-11, -1];
        function drawKeyboardShape(c) {
            c.lineWidth = 3.5;
            c.beginPath();
            if (c.roundRect) c.roundRect(-38, -20, 76, 40, 5); else c.rect(-38, -20, 76, 40);
            c.stroke();
            KEY_YS.forEach(ky => KEY_XS.forEach(kx => {
                c.beginPath();
                if (c.roundRect) c.roundRect(kx - 3.5, ky - 3.5, 7, 7, 1.5); else c.rect(kx - 3.5, ky - 3.5, 7, 7);
                c.fill();
            }));
            c.beginPath();
            if (c.roundRect) c.roundRect(-18, 7, 36, 6, 2); else c.rect(-18, 7, 36, 6);
            c.fill();
        }

        // Mouse: rounded body + scroll-wheel pill + button split + scroll tick (at scrollY).
        const MOUSE_SCROLL_CENTER = -15.5;
        function drawMouseShape(c, scrollY) {
            c.lineWidth = 3.5;
            c.beginPath();
            if (c.roundRect) c.roundRect(-15, -26, 30, 48, [15, 15, 12, 12]); else c.rect(-15, -26, 30, 48);
            c.stroke();
            c.lineWidth = 2.5;
            c.beginPath();
            if (c.roundRect) c.roundRect(-3, -20, 6, 9, 3); else c.rect(-3, -20, 6, 9);
            c.stroke();
            c.beginPath();
            c.moveTo(0, -9);
            c.lineTo(0, 4);
            c.stroke();
            // scroll tick (the wheel position)
            c.lineWidth = 2.2;
            c.beginPath();
            c.moveTo(-1.8, scrollY);
            c.lineTo(1.8, scrollY);
            c.stroke();
        }

        function generateKeyboardData(targetCount) {
            return fillFromPixels(sampleShapePixels(110, drawKeyboardShape), targetCount);
        }

        function generateMouseData(targetCount) {
            return fillFromPixels(sampleShapePixels(80, (c) => drawMouseShape(c, MOUSE_SCROLL_CENTER)), targetCount);
        }

        // Pen taking notes: tilted pen + nib + three note lines (top line is the "writing" one).
        function drawPenShape(c, lineLeftX) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            // pen body (thick capsule)
            c.lineWidth = 6.5;
            c.beginPath();
            c.moveTo(22, -20);
            c.lineTo(0, 2);
            c.stroke();
            // nib taper to the tip
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(0, 2);
            c.lineTo(-5, 7);
            c.stroke();
            // note lines (top one is animated via lineLeftX)
            c.lineWidth = 3;
            c.beginPath(); c.moveTo(lineLeftX, 10); c.lineTo(-7, 10); c.stroke();
            c.beginPath(); c.moveTo(-27, 17); c.lineTo(3, 17); c.stroke();
            c.beginPath(); c.moveTo(-27, 24); c.lineTo(-11, 24); c.stroke();
        }

        // Camera: body + viewfinder bump + lens (two rings) + flash dot.
        function drawCameraShape(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3.5;
            c.beginPath();
            if (c.roundRect) c.roundRect(-35, -16, 70, 38, 6); else c.rect(-35, -16, 70, 38);
            c.stroke();
            c.beginPath();
            if (c.roundRect) c.roundRect(-11, -23, 22, 8, 3); else c.rect(-11, -23, 22, 8);
            c.stroke();
            c.beginPath(); c.arc(0, 3, 13, 0, Math.PI * 2); c.stroke();
            c.lineWidth = 3;
            c.beginPath(); c.arc(0, 3, 7.5, 0, Math.PI * 2); c.stroke();
            c.beginPath(); c.arc(23, -9, 2.5, 0, Math.PI * 2); c.fill();
        }

        function generatePenData(targetCount) {
            return fillFromPixels(sampleShapePixels(90, (c) => drawPenShape(c, PEN_LINE_REST)), targetCount);
        }

        function generateCameraData(targetCount) {
            return fillFromPixels(sampleShapePixels(100, drawCameraShape), targetCount);
        }

        // Drag-and-drop: a dashed drop-zone + a box (at bx,by) being dragged into it.
        function drawDragDropShape(c, bx, by) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            // drop-zone (dashed)
            c.lineWidth = 2.5;
            c.setLineDash([4, 4]);
            c.beginPath();
            if (c.roundRect) c.roundRect(2, -2, 30, 28, 4); else c.rect(2, -2, 30, 28);
            c.stroke();
            c.setLineDash([]);
            // dragged box
            c.lineWidth = 3;
            c.beginPath();
            if (c.roundRect) c.roundRect(bx - 9, by - 9, 18, 18, 3); else c.rect(bx - 9, by - 9, 18, 18);
            c.stroke();
        }

        // Todo list: 3 rows (checkbox + task line). Each row i gets an animated
        // check + strike when alphas[i] > 0 (empty list when all zero).
        const TODO_ROWS = [-16, 0, 16];
        const TODO_ENDS = [22, 26, 14];
        function drawTodoShape(c, alphas) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            for (let i = 0; i < TODO_ROWS.length; i++) {
                const ry = TODO_ROWS[i];
                c.lineWidth = 2.5;
                c.beginPath();
                if (c.roundRect) c.roundRect(-31, ry - 4.5, 9, 9, 2); else c.rect(-31, ry - 4.5, 9, 9);
                c.stroke();
                c.lineWidth = 3;
                c.beginPath();
                c.moveTo(-18, ry);
                c.lineTo(TODO_ENDS[i], ry);
                c.stroke();
            }
            // per-row "checked" overlay: checkmark in the box + strikethrough on the task
            for (let i = 0; i < TODO_ROWS.length; i++) {
                const a = alphas[i];
                if (a > 0.01) {
                    const ry = TODO_ROWS[i];
                    c.save();
                    c.globalAlpha *= a;
                    c.lineWidth = 2.2;
                    c.beginPath();
                    c.moveTo(-29.5, ry);
                    c.lineTo(-27, ry + 2.5);
                    c.lineTo(-23.5, ry - 3);
                    c.stroke();
                    c.lineWidth = 2.5;
                    c.beginPath();
                    c.moveTo(-18, ry);
                    c.lineTo(TODO_ENDS[i], ry);
                    c.stroke();
                    c.restore();
                }
            }
        }

        function generateDragDropData(targetCount) {
            return fillFromPixels(sampleShapePixels(90, (c) => drawDragDropShape(c, DRAG_START.x, DRAG_START.y)), targetCount);
        }

        function generateTodoData(targetCount) {
            return fillFromPixels(sampleShapePixels(90, (c) => drawTodoShape(c, [0, 0, 0])), targetCount);
        }

        // Open book lying in perspective: narrow at the top (far), wide at the base (near).
        // Lines: [x1, y1, x2, y2] for the right page (converge toward the top, widen at base).
        const BOOK_LINES = [[5, -11, 19, -10], [5, -4, 26, -3], [6, 3, 31, 4], [6, 10, 35, 11]];
        function drawBookPage(c, mirror) {
            // one trapezoidal page outline (mirror = 1 right, -1 left)
            const m = mirror;
            c.beginPath();
            c.moveTo(0, -19);
            c.quadraticCurveTo(m * 10, -22, m * 20, -15); // far/top edge (narrow)
            c.lineTo(m * 38, 16);                          // outer edge, fanning out to the near/base
            c.quadraticCurveTo(m * 18, 21, 0, 19);         // near/base edge (wide)
            c.stroke();
        }
        function drawBookShape(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3;
            drawBookPage(c, -1); // left page
            drawBookPage(c, 1);  // right page
            // spine
            c.lineWidth = 2.5;
            c.beginPath();
            c.moveTo(0, -19);
            c.lineTo(0, 19);
            c.stroke();
            // text lines (4 per page)
            c.lineWidth = 2;
            BOOK_LINES.forEach(L => { c.beginPath(); c.moveTo(L[0], L[1]); c.lineTo(L[2], L[3]); c.stroke(); });
            BOOK_LINES.forEach(L => { c.beginPath(); c.moveTo(-L[0], L[1]); c.lineTo(-L[2], L[3]); c.stroke(); });
        }

        // A single right-side page leaf (outline + lines), anchored at the spine (x=0).
        // The turning page is this leaf with a lift transform applied (rises up + flips).
        function drawBookLeaf(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3;
            drawBookPage(c, 1);
            c.lineWidth = 2;
            BOOK_LINES.forEach(L => { c.beginPath(); c.moveTo(L[0], L[1]); c.lineTo(L[2], L[3]); c.stroke(); });
        }

        function generateBookData(targetCount) {
            return fillFromPixels(sampleShapePixels(110, drawBookShape), targetCount);
        }

        // Open app box: an isometric crate with its lid flaps splayed open, word "apps" rising.
        // Rim corners: back (0,-14), right (24,-6), front (0,2), left (-24,-6).
        function drawAppBoxShape(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3;
            // open rim (rhombus)
            c.beginPath();
            c.moveTo(0, -14);
            c.lineTo(24, -6);
            c.lineTo(0, 2);
            c.lineTo(-24, -6);
            c.closePath();
            c.stroke();
            // vertical edges (left / front / right)
            c.beginPath(); c.moveTo(-24, -6); c.lineTo(-24, 14); c.stroke();
            c.beginPath(); c.moveTo(0, 2); c.lineTo(0, 22); c.stroke();
            c.beginPath(); c.moveTo(24, -6); c.lineTo(24, 14); c.stroke();
            // bottom edges to front-bottom corner
            c.beginPath(); c.moveTo(-24, 14); c.lineTo(0, 22); c.stroke();
            c.beginPath(); c.moveTo(24, 14); c.lineTo(0, 22); c.stroke();
            // open lid flaps (two back flaps splayed up-and-out)
            c.beginPath();
            c.moveTo(0, -14); c.lineTo(-24, -6); c.lineTo(-39, -16); c.lineTo(-15, -24);
            c.closePath(); c.stroke();
            c.beginPath();
            c.moveTo(0, -14); c.lineTo(24, -6); c.lineTo(39, -16); c.lineTo(15, -24);
            c.closePath(); c.stroke();
        }

        // The word "apps" rising up out of the open box while settled. It emerges from the
        // opening, floats up and fades, looping; an envelope forces alpha to 0 at the hold
        // edges so the particle box (no word) matches at the transitions. Vector-only.
        function appWord(time) {
            let tc = time % CYCLE_MS;
            let h0 = HOLD_AP[0], h1 = HOLD_AP[1];
            if (tc < h0 + 200 || tc > h1 - 200) return null;
            let active = tc - (h0 + 200);
            let dur = (h1 - h0) - 400;
            let env = Math.min(1, active / 450) * Math.min(1, (dur - active) / 450);
            const PERIOD = dur / 3;
            let ph = (active % PERIOD) / PERIOD;
            let y = -8 - ph * 30;                  // rise from the opening up past the flaps
            let scale = 0.85 + ph * 0.4;            // grow a little as it rises
            let a = ph < 0.2 ? ph / 0.2 : (ph > 0.6 ? Math.max(0, (1 - ph) / 0.4) : 1);
            return { y: y, scale: scale, alpha: a * env };
        }

        function generateAppBoxData(targetCount) {
            return fillFromPixels(sampleShapePixels(110, drawAppBoxShape), targetCount);
        }

        // Progress tracker: a circular ring. Particles form the track ring; while settled a
        // bold arc sweeps around it with a leading dot and a percentage counting up.
        function drawProgressRingShape(c) {
            c.lineCap = 'round';
            c.lineWidth = 3;
            c.beginPath();
            c.arc(0, 0, 31, 0, Math.PI * 2);
            c.stroke();
        }

        // Progress fill while settled: fills 0->100%, holds full briefly, then loops (2x).
        // Envelope -> 0 at hold edges so the bold arc/dot/% are vector-only extras and the
        // particle ring matches at the transitions.
        function progressVal(time) {
            let tc = time % CYCLE_MS;
            let h0 = HOLD_PR[0], h1 = HOLD_PR[1];
            if (tc < h0 + 200 || tc > h1 - 200) return null;
            let active = tc - (h0 + 200);
            let dur = (h1 - h0) - 400;
            let env = Math.min(1, active / 450) * Math.min(1, (dur - active) / 450);
            const PERIOD = dur; // one smooth fill per hold
            let raw = (active % PERIOD) / PERIOD;
            let ph = raw < 0.8 ? raw / 0.8 : 1; // fill, then hold 100% before reset
            return { ph: ph, env: env };
        }

        function generateProgressData(targetCount) {
            return fillFromPixels(sampleShapePixels(100, drawProgressRingShape), targetCount);
        }

        // View file: a document (folded corner + text lines) with a magnifying glass that
        // scans across it. lx/ly is the lens center (defaults to its resting spot).
        const VIEWFILE_LENS_REST = { x: 10, y: 14 };
        function drawViewFileShape(c, lx, ly) {
            if (lx === undefined) lx = VIEWFILE_LENS_REST.x;
            if (ly === undefined) ly = VIEWFILE_LENS_REST.y;
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3;
            // document outline with folded top-right corner
            c.beginPath();
            c.moveTo(-19, -26);
            c.lineTo(7, -26);
            c.lineTo(18, -15);
            c.lineTo(18, 26);
            c.lineTo(-19, 26);
            c.closePath();
            c.stroke();
            // fold flap (dog-ear)
            c.beginPath();
            c.moveTo(7, -26);
            c.lineTo(7, -15);
            c.lineTo(18, -15);
            c.stroke();
            // text lines
            c.lineWidth = 2.4;
            [-7, 1, 9].forEach(y => { c.beginPath(); c.moveTo(-12, y); c.lineTo(8, y); c.stroke(); });
            // magnifying glass (lens + handle) — scans across the document
            const r = 11;
            c.lineWidth = 3;
            c.beginPath();
            c.arc(lx, ly, r, 0, Math.PI * 2);
            c.stroke();
            const hx = lx + r * Math.cos(Math.PI / 4), hy = ly + r * Math.sin(Math.PI / 4);
            c.lineWidth = 4.2;
            c.beginPath();
            c.moveTo(hx, hy);
            c.lineTo(hx + 9, hy + 9);
            c.stroke();
        }

        // Magnifying-glass scan: the lens traces a slow path over the text while the
        // view-file shape is settled, easing out of / back to its rest spot at the hold
        // edges so the particle layout (glass at rest) matches at the transitions.
        function viewFileLensPos(time) {
            let tc = time % CYCLE_MS;
            const a = HOLD_VIEW[0] + 250, b = HOLD_VIEW[1] - 250;
            if (tc < a || tc > b) return VIEWFILE_LENS_REST;
            const local = tc - a, dur = b - a;
            const env = Math.min(1, local / 500) * Math.min(1, (dur - local) / 500);
            const x = -1 + 8 * Math.cos(local / 340); // sweep across the text columns
            const y = 1 + 8 * Math.sin(local / 560);   // drift down the lines
            return { x: VIEWFILE_LENS_REST.x + (x - VIEWFILE_LENS_REST.x) * env,
                     y: VIEWFILE_LENS_REST.y + (y - VIEWFILE_LENS_REST.y) * env };
        }

        function generateViewFileData(targetCount) {
            return fillFromPixels(sampleShapePixels(90, (c) => drawViewFileShape(c, VIEWFILE_LENS_REST.x, VIEWFILE_LENS_REST.y)), targetCount);
        }

        // grep: search file content. Particles form a left gutter + lines of "text"; while
        // settled a highlight box cycles between the matching lines (the search hits).
        const GREP_GUTTER_X = -32;
        const GREP_LINES = [
            { y: -20, x1: -26, x2: 18 },
            { y: -10, x1: -26, x2: 28 }, // match
            { y: 0,   x1: -26, x2: 6  },
            { y: 10,  x1: -26, x2: 30 }, // match
            { y: 20,  x1: -26, x2: 12 }
        ];
        const GREP_MATCH_ROWS = [1, 3];
        function drawGrepShape(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            // left gutter bar (reads as a file / code block)
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(GREP_GUTTER_X, -26);
            c.lineTo(GREP_GUTTER_X, 26);
            c.stroke();
            // text lines
            GREP_LINES.forEach(L => { c.beginPath(); c.moveTo(L.x1, L.y); c.lineTo(L.x2, L.y); c.stroke(); });
        }
        function generateGrepData(targetCount) {
            return fillFromPixels(sampleShapePixels(90, drawGrepShape), targetCount);
        }

        // grep match box: eases between the two matching lines (cycling through hits) while
        // settled, dwelling on each; 0 at the hold edges so particles show plain lines.
        function grepHighlight(time) {
            let tc = time % CYCLE_MS;
            const a = HOLD_GREP[0] + 250, b = HOLD_GREP[1] - 250;
            if (tc < a || tc > b) return null;
            const local = tc - a, dur = b - a;
            const env = Math.min(1, local / 400) * Math.min(1, (dur - local) / 400);
            const rows = GREP_MATCH_ROWS.map(i => GREP_LINES[i].y);
            const PERIOD = 1700;
            const ph = (local % (PERIOD * rows.length)) / PERIOD; // 0..rows.length
            const idx = Math.floor(ph) % rows.length;
            const nidx = (idx + 1) % rows.length;
            const f = ph - Math.floor(ph);
            const move = f < 0.55 ? 0 : easeInOutCubic((f - 0.55) / 0.45); // dwell, then hop
            const y = rows[idx] + (rows[nidx] - rows[idx]) * move;
            return { y: y, env: env };
        }

        // glob: match files by a wildcard pattern. Particles form a "*" pattern above a row
        // of file cards; while settled the cards light up one-by-one (files matching).
        const GLOB_STAR = { cx: 0, cy: -12, r: 14 };
        const GLOB_CARDS = [{ x: -22, y: 16 }, { x: 0, y: 16 }, { x: 22, y: 16 }];
        const GLOB_CARD_W = 15, GLOB_CARD_H = 19, GLOB_CARD_FOLD = 5;
        function drawGlobStar(c, scale) {
            const r = GLOB_STAR.r * (scale || 1), cx = GLOB_STAR.cx, cy = GLOB_STAR.cy;
            c.lineWidth = 4;
            [Math.PI / 6, Math.PI / 2, 5 * Math.PI / 6].forEach(ang => { // 6-point asterisk
                c.beginPath();
                c.moveTo(cx - Math.cos(ang) * r, cy - Math.sin(ang) * r);
                c.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
                c.stroke();
            });
        }
        function globCardPath(c, x, y) {
            const w = GLOB_CARD_W, h = GLOB_CARD_H, fold = GLOB_CARD_FOLD;
            c.beginPath();
            c.moveTo(x - w / 2, y - h / 2);
            c.lineTo(x + w / 2 - fold, y - h / 2);
            c.lineTo(x + w / 2, y - h / 2 + fold);
            c.lineTo(x + w / 2, y + h / 2);
            c.lineTo(x - w / 2, y + h / 2);
            c.closePath();
        }
        function drawGlobShape(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            drawGlobStar(c, 1);
            c.lineWidth = 2.6;
            GLOB_CARDS.forEach(card => { globCardPath(c, card.x, card.y); c.stroke(); });
        }
        function generateGlobData(targetCount) {
            return fillFromPixels(sampleShapePixels(100, drawGlobShape), targetCount);
        }

        // glob matches: cards light cumulatively (file 1, then 2, then 3), hold, fade, loop;
        // the "*" pattern breathes gently. 0 at the hold edges so particles match (no fills).
        function globMatch(time) {
            let tc = time % CYCLE_MS;
            const a = HOLD_GLOB[0] + 250, b = HOLD_GLOB[1] - 250;
            if (tc < a || tc > b) return null;
            const local = tc - a, dur = b - a;
            const env = Math.min(1, local / 400) * Math.min(1, (dur - local) / 400);
            const n = GLOB_CARDS.length;
            const STEP = 480, HOLD = 700, FADE = 350;
            const CYCLE = STEP * n + HOLD + FADE;
            const t = local % CYCLE;
            let alphas = [];
            for (let i = 0; i < n; i++) {
                let av = t >= i * STEP ? Math.min(1, (t - i * STEP) / 130) : 0;
                if (t > STEP * n + HOLD) av *= Math.max(0, 1 - (t - (STEP * n + HOLD)) / FADE);
                alphas.push(av);
            }
            const pulse = 1 + 0.05 * env * Math.sin(local / 240);
            return { alphas: alphas, env: env, pulse: pulse };
        }

        // replace: edit a file — a single HORIZONTAL (landscape) code window holding several
        // lines taller than the view. While settled the lines scroll up & down (revealing the
        // off-view lines), THEN the lines are replaced (set A crossfades to set B), then back.
        // Loops; rests at scroll 0 / set A at the edges so particles match. Lines clipped to view.
        const REPLACE_W_HW = 38, REPLACE_W_HH = 20;        // window half-extents (wide, short)
        const REPLACE_CLIP_HW = 34, REPLACE_CLIP_HH = 15;  // interior where lines show (clip)
        const REPLACE_LINE_X1 = -30, REPLACE_SCROLL = 12;
        const REPLACE_LINES_A = [ // current lines (also the resting / particle state)
            { y: -21, x2: 18 }, { y: -13, x2: 28 }, { y: -5, x2: 8 },
            { y: 3, x2: 24 }, { y: 11, x2: 14 }, { y: 19, x2: 30 }
        ];
        const REPLACE_LINES_B = [ // replacement lines (different lengths -> reads as new code)
            { y: -21, x2: 10 }, { y: -13, x2: 16 }, { y: -5, x2: 26 },
            { y: 3, x2: 6 }, { y: 11, x2: 22 }, { y: 19, x2: 12 }
        ];
        function drawReplaceWindow(c) {
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = 3;
            c.beginPath();
            if (c.roundRect) c.roundRect(-REPLACE_W_HW, -REPLACE_W_HH, 2 * REPLACE_W_HW, 2 * REPLACE_W_HH, 5);
            else c.rect(-REPLACE_W_HW, -REPLACE_W_HH, 2 * REPLACE_W_HW, 2 * REPLACE_W_HH);
            c.stroke();
        }
        // Lines translated by scrollY and crossfaded A->B by m, clipped to the window interior.
        function drawReplaceLines(c, m, scrollY, alphaBase) {
            c.save();
            c.beginPath();
            if (c.roundRect) c.roundRect(-REPLACE_CLIP_HW, -REPLACE_CLIP_HH, 2 * REPLACE_CLIP_HW, 2 * REPLACE_CLIP_HH, 3);
            else c.rect(-REPLACE_CLIP_HW, -REPLACE_CLIP_HH, 2 * REPLACE_CLIP_HW, 2 * REPLACE_CLIP_HH);
            c.clip();
            c.lineCap = 'round';
            c.lineWidth = 2.8;
            if (1 - m > 0.01) {
                c.globalAlpha = alphaBase * (1 - m);
                REPLACE_LINES_A.forEach(L => { const y = L.y + scrollY; c.beginPath(); c.moveTo(REPLACE_LINE_X1, y); c.lineTo(L.x2, y); c.stroke(); });
            }
            if (m > 0.01) {
                c.globalAlpha = alphaBase * m;
                REPLACE_LINES_B.forEach(L => { const y = L.y + scrollY; c.beginPath(); c.moveTo(REPLACE_LINE_X1, y); c.lineTo(L.x2, y); c.stroke(); });
            }
            c.restore();
        }
        function drawReplaceShape(c) {
            drawReplaceWindow(c);
            drawReplaceLines(c, 0, 0, 1); // rest: set A, no scroll (matches particles)
        }
        function generateReplaceData(targetCount) {
            return fillFromPixels(sampleShapePixels(110, drawReplaceShape), targetCount);
        }

        // replace animation: scroll up & down first, THEN replace the lines, then revert.
        // Returns scroll offset + crossfade mix; both are 0 / set-A at the hold edges.
        function replaceAnim(time) {
            let tc = time % CYCLE_MS;
            const a = HOLD_REPLACE[0] + 250, b = HOLD_REPLACE[1] - 250;
            if (tc < a || tc > b) return { scrollY: 0, m: 0 };
            const local = tc - a, dur = b - a;
            const p = local / dur; // 0..1 across the active hold
            let scrollY = 0;
            if (p < 0.30) scrollY = REPLACE_SCROLL * Math.sin((p / 0.30) * Math.PI * 2); // up then down, back to 0
            let m;
            if (p < 0.35) m = 0;
            else if (p < 0.48) m = easeInOutCubic((p - 0.35) / 0.13); // replace A -> B
            else if (p < 0.62) m = 1;
            else if (p < 0.75) m = 1 - easeInOutCubic((p - 0.62) / 0.13); // revert B -> A
            else m = 0;
            return { scrollY: scrollY, m: m };
        }

        // --- Initialization ---
        function initParticles() {
            particles = [];
            let loaderData = [];
            let globeData = [];
            let screenData = [];
            let treeData = [];
            let serverData = [];
            let tickData = [];
            let coderData = [];
            let minionData = [];
            let shellData = [];
            let terminalData = [];
            let cursorData = [];
            let clockData = [];
            let keyboardData = [];
            let mouseData = [];
            let penData = [];
            let cameraData = [];
            let dragDropData = [];
            let todoData = [];
            let bookData = [];
            let appBoxData = [];
            let progressData = [];
            let viewFileData = [];
            let grepData = [];
            let globData = [];
            let replaceData = [];
            
            // 1. Generate Loader Positions
            for(let i = 0; i < OUTER_SPOKES; i++) {
                let angle = (i / OUTER_SPOKES) * Math.PI * 2;
                for(let j = 0; j < PARTICLES_PER_SPOKE; j++) {
                    let t = j / (PARTICLES_PER_SPOKE - 1);
                    loaderData.push({ type: 'outer', angle: angle, r: 32 + t * 10, pRadius: 2.5 });
                }
            }
            for(let i = 0; i < INNER_SPOKES; i++) {
                let angle = (i / INNER_SPOKES) * Math.PI * 2;
                for(let j = 0; j < PARTICLES_PER_SPOKE; j++) {
                    let t = j / (PARTICLES_PER_SPOKE - 1);
                    loaderData.push({ type: 'inner', angle: angle, r: 16 + t * 6, pRadius: 1.8 });
                }
            }

            // 2. Generate Globe Positions
            for(let i = 0; i < 12; i++) {
                let theta = (i / 12) * Math.PI * 2;
                for(let j = 0; j < 40; j++) {
                    let phi = (j / 39) * Math.PI; 
                    globeData.push({ theta: theta, phi: phi });
                }
            }
            for(let i = 0; i < 8; i++) {
                let phi = ((i + 1) / 9) * Math.PI; 
                for(let j = 0; j < 40; j++) {
                    let theta = (j / 40) * Math.PI * 2;
                    globeData.push({ theta: theta, phi: phi });
                }
            }

            // 3. Generate PC Screen Positions
            screenData = generateScreenData(TOTAL_PARTICLES);

            // 4. Generate Node Tree Positions
            treeData = generateTreeData(TOTAL_PARTICLES);

            // 5. Generate Server Rack Positions
            serverData = generateServerData(TOTAL_PARTICLES);

            // 6. Generate Tick Positions
            tickData = generateTickData(TOTAL_PARTICLES);

            // 7. Generate "coder" (single head) + "minion" (three heads) Positions
            coderData = generateCoderData(TOTAL_PARTICLES);     // 'coder'  — single AI head
            minionData = generateMinionData(TOTAL_PARTICLES);   // 'minion' — three AI heads

            // 8. Generate Shell Positions
            shellData = generateShellData(TOTAL_PARTICLES);

            // 9. Generate Terminal Positions
            terminalData = generateTerminalData(TOTAL_PARTICLES);

            // 10. Generate Cursor Positions
            cursorData = generateCursorData(TOTAL_PARTICLES, CURSOR_PTS);

            // 11. Generate Clock Positions
            clockData = generateClockData(TOTAL_PARTICLES);

            // 12. Generate Keyboard Positions
            keyboardData = generateKeyboardData(TOTAL_PARTICLES);

            // 13. Generate Mouse Positions
            mouseData = generateMouseData(TOTAL_PARTICLES);

            // 14. Generate Pen Positions
            penData = generatePenData(TOTAL_PARTICLES);

            // 15. Generate Camera Positions
            cameraData = generateCameraData(TOTAL_PARTICLES);

            // 16. Generate Drag-and-Drop Positions
            dragDropData = generateDragDropData(TOTAL_PARTICLES);

            // 17. Generate Todo Positions
            todoData = generateTodoData(TOTAL_PARTICLES);

            // 18. Generate Book Positions
            bookData = generateBookData(TOTAL_PARTICLES);

            // 19. Generate App Box Positions
            appBoxData = generateAppBoxData(TOTAL_PARTICLES);

            // 20. Generate Progress Ring Positions
            progressData = generateProgressData(TOTAL_PARTICLES);

            // 21. Generate View File Positions
            viewFileData = generateViewFileData(TOTAL_PARTICLES);

            // 22. Generate Grep Positions
            grepData = generateGrepData(TOTAL_PARTICLES);

            // 23. Generate Glob Positions
            globData = generateGlobData(TOTAL_PARTICLES);

            // 24. Generate Replace Positions
            replaceData = generateReplaceData(TOTAL_PARTICLES);

            // Shuffle destinations to create chaotic swarming during transitions
            for (let i = globeData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [globeData[i], globeData[j]] = [globeData[j], globeData[i]];
                
                const k = Math.floor(Math.random() * (i + 1));
                [screenData[i], screenData[k]] = [screenData[k], screenData[i]];

                const l = Math.floor(Math.random() * (i + 1));
                [treeData[i], treeData[l]] = [treeData[l], treeData[i]];

                const m = Math.floor(Math.random() * (i + 1));
                [serverData[i], serverData[m]] = [serverData[m], serverData[i]];

                const n = Math.floor(Math.random() * (i + 1));
                [tickData[i], tickData[n]] = [tickData[n], tickData[i]];

                const o = Math.floor(Math.random() * (i + 1));
                [coderData[i], coderData[o]] = [coderData[o], coderData[i]];

                const o2 = Math.floor(Math.random() * (i + 1));
                [minionData[i], minionData[o2]] = [minionData[o2], minionData[i]];

                const p = Math.floor(Math.random() * (i + 1));
                [shellData[i], shellData[p]] = [shellData[p], shellData[i]];

                const q = Math.floor(Math.random() * (i + 1));
                [terminalData[i], terminalData[q]] = [terminalData[q], terminalData[i]];

                const u = Math.floor(Math.random() * (i + 1));
                [cursorData[i], cursorData[u]] = [cursorData[u], cursorData[i]];

                const v = Math.floor(Math.random() * (i + 1));
                [clockData[i], clockData[v]] = [clockData[v], clockData[i]];

                const w2 = Math.floor(Math.random() * (i + 1));
                [keyboardData[i], keyboardData[w2]] = [keyboardData[w2], keyboardData[i]];

                const z = Math.floor(Math.random() * (i + 1));
                [mouseData[i], mouseData[z]] = [mouseData[z], mouseData[i]];

                const aa = Math.floor(Math.random() * (i + 1));
                [penData[i], penData[aa]] = [penData[aa], penData[i]];

                const bb = Math.floor(Math.random() * (i + 1));
                [cameraData[i], cameraData[bb]] = [cameraData[bb], cameraData[i]];

                const cc = Math.floor(Math.random() * (i + 1));
                [dragDropData[i], dragDropData[cc]] = [dragDropData[cc], dragDropData[i]];

                const dd2 = Math.floor(Math.random() * (i + 1));
                [todoData[i], todoData[dd2]] = [todoData[dd2], todoData[i]];

                const ee = Math.floor(Math.random() * (i + 1));
                [bookData[i], bookData[ee]] = [bookData[ee], bookData[i]];

                const ff = Math.floor(Math.random() * (i + 1));
                [appBoxData[i], appBoxData[ff]] = [appBoxData[ff], appBoxData[i]];

                const gg = Math.floor(Math.random() * (i + 1));
                [progressData[i], progressData[gg]] = [progressData[gg], progressData[i]];

                const hh = Math.floor(Math.random() * (i + 1));
                [viewFileData[i], viewFileData[hh]] = [viewFileData[hh], viewFileData[i]];

                const ii = Math.floor(Math.random() * (i + 1));
                [grepData[i], grepData[ii]] = [grepData[ii], grepData[i]];

                const jj = Math.floor(Math.random() * (i + 1));
                [globData[i], globData[jj]] = [globData[jj], globData[i]];

                const kk = Math.floor(Math.random() * (i + 1));
                [replaceData[i], replaceData[kk]] = [replaceData[kk], replaceData[i]];
            }

            // Combine them into a single unified particle object
            for(let i = 0; i < TOTAL_PARTICLES; i++) {
                particles.push({
                    l: loaderData[i],
                    g: globeData[i],
                    s: screenData[i],
                    tr: treeData[i],
                    sv: serverData[i],
                    t: tickData[i],
                    coder: coderData[i],
                    minion: minionData[i],
                    sh: shellData[i],
                    cl: terminalData[i],
                    ck: clockData[i],
                    cu: cursorData[i],
                    cuR: cursorData[i],
                    cu3: cursorData[i],
                    kb: keyboardData[i],
                    mo: mouseData[i],
                    pn: penData[i],
                    cm: cameraData[i],
                    dd: dragDropData[i],
                    td: todoData[i],
                    tu: todoData[i],
                    bk: bookData[i],
                    ap: appBoxData[i],
                    pr: progressData[i],
                    view: viewFileData[i],
                    grep: grepData[i],
                    glob: globData[i],
                    replace: replaceData[i]
                });
            }
        }

        // Easing function
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // Cursor "breathing" click: one breath = N presses (1 single, 2 double, 3 triple),
        // active only while that cursor is the settled shape (its own hold window).
        function clickScale(time, holdStart, holdEnd, clicks) {
            let tc = time % CYCLE_MS;
            const m = 250; // calm margin at the transition edges
            if (tc < holdStart + m || tc > holdEnd - m) return 1.0;
            let local = (tc - (holdStart + m)) % 2000; // one breath every 2.0s
            let dip;
            if (clicks === 3) {
                const g = (c) => Math.exp(-Math.pow((local - c) / 80, 2));
                dip = Math.min(1, g(700) + g(960) + g(1220)); // three presses ~260ms apart
            } else if (clicks === 2) {
                const g = (c) => Math.exp(-Math.pow((local - c) / 85, 2));
                dip = Math.min(1, g(850) + g(1150)); // two presses ~300ms apart
            } else {
                dip = Math.exp(-Math.pow((local - 1000) / 160, 2)); // one soft press
            }
            return 1.0 - 0.15 * dip; // press shrinks toward 0.85, eases back
        }

        // Mouse scroll-wheel tick position: oscillates within the wheel while the
        // mouse is the settled shape (its hold window), else rests at center.
        function mouseScrollY(time) {
            let tc = time % CYCLE_MS;
            if (tc < HOLD_MO[0] + 250 || tc > HOLD_MO[1] - 250) return MOUSE_SCROLL_CENTER;
            return MOUSE_SCROLL_CENTER + 3.0 * Math.sin((tc - (HOLD_MO[0] + 250)) / 200);
        }

        // Pen writing line: its left end sweeps in/out (the ink being written) while the
        // pen is the settled shape; rests at PEN_LINE_REST otherwise.
        function penWriteLen(time) {
            let tc = time % CYCLE_MS;
            if (tc < HOLD_PN[0] + 250 || tc > HOLD_PN[1] - 250) return PEN_LINE_REST;
            return PEN_LINE_REST + 8 * Math.sin((tc - (HOLD_PN[0] + 250)) / 230);
        }

        // Book page turn: a right-side leaf sweeps right -> left around the spine (one
        // turn per 1.5s) while settled. cos(angle) foreshortens it; at angle 0/PI it
        // coincides with a static page so the loop reset is invisible. 0 at the edges.
        function pageTurnAngle(time) {
            let tc = time % CYCLE_MS;
            if (tc < HOLD_BK[0] + 250 || tc > HOLD_BK[1] - 250) return 0;
            let local = (tc - (HOLD_BK[0] + 250)) % 1500;
            return (local / 1500) * Math.PI;
        }

        // Drag-and-drop box position: glides start <-> drop-zone (2 full cycles) while the
        // shape is settled, resting at the start otherwise (ends at start, no snap).
        const DRAG_START = { x: -18, y: -14 };
        const DRAG_TARGET = { x: 17, y: 12 };
        function dragBoxPos(time) {
            let tc = time % CYCLE_MS;
            const a = HOLD_DD[0] + 250, b = HOLD_DD[1] - 250;
            if (tc < a || tc > b) return DRAG_START;
            let theta = (tc - a) * (4 * Math.PI) / (b - a); // 2 full start->target->start cycles
            let e = (1 - Math.cos(theta)) / 2;
            return { x: DRAG_START.x + (DRAG_TARGET.x - DRAG_START.x) * e,
                     y: DRAG_START.y + (DRAG_TARGET.y - DRAG_START.y) * e };
        }

        // Update-todo: per-row check opacities. All three rows tick on FAST (staggered),
        // hold checked, fade out, loop. 0 at the edges so particles show an empty list.
        function todoUpdateAlphas(time) {
            let tc = time % CYCLE_MS;
            if (tc < HOLD_TU[0] + 250 || tc > HOLD_TU[1] - 250) return [0, 0, 0];
            let t = (tc - (HOLD_TU[0] + 250)) % 1800; // fast cycle every 1.8s
            const tickIn = (start) => {
                if (t < start) return 0;
                if (t < start + 130) return (t - start) / 130; // quick rise
                return 1;
            };
            let fade = 1;
            if (t > 1300 && t < 1600) fade = 1 - (t - 1300) / 300;
            else if (t >= 1600) fade = 0;
            return [tickIn(0) * fade, tickIn(120) * fade, tickIn(240) * fade];
        }

        // Draws a rounded cursor (fill + round-join stroke), pulsing about its centroid.
        function drawCursorVector(pts, pivot, s) {
            ctx.translate(pivot.x, pivot.y);
            ctx.scale(s, s);
            ctx.translate(-pivot.x, -pivot.y);
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // Extracts exactly where a particle should be depending on the active shape
        function getShapePos(shapeType, p, time) {
            if (shapeType === 'l') {
                const loaderOuterAngle = time * 0.0015;
                const loaderInnerAngle = -time * 0.0025;
                const lAngle = p.l.angle + (p.l.type === 'outer' ? loaderOuterAngle : loaderInnerAngle);
                return { x: Math.cos(lAngle) * p.l.r, y: Math.sin(lAngle) * p.l.r, z: 0, pRadius: p.l.pRadius, is3D: false };
            } 
            else if (shapeType === 'g') {
                const earthSpinAngle = time * 0.001;
                const currentTheta = p.g.theta + earthSpinAngle;
                return {
                    x: Math.sin(p.g.phi) * Math.cos(currentTheta) * GLOBE_RADIUS,
                    y: Math.cos(p.g.phi) * GLOBE_RADIUS,
                    z: Math.sin(p.g.phi) * Math.sin(currentTheta) * GLOBE_RADIUS,
                    pRadius: 1.2, is3D: true
                };
            }
            else if (shapeType === 's') {
                return { x: p.s.x, y: p.s.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 'tr') {
                return { x: p.tr.x, y: p.tr.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 'sv') {
                return { x: p.sv.x, y: p.sv.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 't') {
                return { x: p.t.x, y: p.t.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 'coder') {
                return { x: p.coder.x, y: p.coder.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 'minion') {
                return { x: p.minion.x, y: p.minion.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
            else if (shapeType === 'sh') {
                return { x: p.sh.x, y: p.sh.y, z: 0, pRadius: 2.4, is3D: false }; 
            }
