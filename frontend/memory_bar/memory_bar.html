<!-- Memory bar — far-right vertical token gauge, drawn in the BACKGROUND (like the
     "Made to do..." hero, not in any container). The fill height is driven by
     window.updateMemoryBar(used, cap) from the backend; it climbs as the chat
     consumes tokens toward the 300k cap and turns red when full. Injected into
     <body> by memory_bar/memory_bar.js. -->
<div class="memory-bar" id="memoryBar" aria-hidden="true">
    <svg class="memory-bar-logo" viewBox="0 0 160 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory">
        <g class="legs" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
            <line x1="40" y1="13" x2="40" y2="28"/>
            <line x1="60" y1="13" x2="60" y2="28"/>
            <line x1="80" y1="13" x2="80" y2="28"/>
            <line x1="100" y1="13" x2="100" y2="28"/>
            <line x1="120" y1="13" x2="120" y2="28"/>
            <line x1="40" y1="68" x2="40" y2="83"/>
            <line x1="60" y1="68" x2="60" y2="83"/>
            <line x1="80" y1="68" x2="80" y2="83"/>
            <line x1="100" y1="68" x2="100" y2="83"/>
            <line x1="120" y1="68" x2="120" y2="83"/>
        </g>
        <rect x="20" y="28" width="120" height="40" rx="12" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
        <text x="80" y="48" text-anchor="middle" dominant-baseline="central"
              fill="currentColor" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
              font-size="20" font-weight="400" letter-spacing="0.5">Memory</text>
    </svg>

    <div class="memory-bar-track">
        <div class="memory-bar-fill"></div>
    </div>
</div>
