    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Lighter cream background tone */
            background-color: #F9F1EC; 
            font-family: sans-serif;
        }

        .icon-container {
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cursor-svg {
            width: 100%;
            height: 100%;
            /* Soft shadow */
            filter: drop-shadow(4px 6px 5px rgba(79, 54, 63, 0.15));
        }

        /* --- Restored Loading Ripple Animation --- */
        .burst-lines line {
            stroke-dasharray: 20; 
            stroke-dashoffset: 8; /* Keeps the line mostly visible at all times */
            opacity: 1; /* Always dark, no fading */
            animation: sequentialRipple 2s infinite ease-in-out;
        }

        /* Stagger the delays perfectly so one finishes as the next peaks */
        .burst-lines line:nth-child(1) { animation-delay: 0.0s; }
        .burst-lines line:nth-child(2) { animation-delay: 0.2s; }
        .burst-lines line:nth-child(3) { animation-delay: 0.4s; }
        .burst-lines line:nth-child(4) { animation-delay: 0.6s; }
        .burst-lines line:nth-child(5) { animation-delay: 0.8s; }

        @keyframes sequentialRipple {
            0% {
                stroke-dashoffset: 8; /* Normal state */
            }
            10% {
                stroke-dashoffset: 0; /* Fully grown */
            }
            20%, 100% {
                stroke-dashoffset: 8; /* Back to normal and stays there */
            }
        }
    </style>
</head>

        <svg class="cursor-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            
            <!-- Global rotation to match the slant of the mouse -->
            <g transform="translate(125, 115) rotate(55)">
                
                <!-- Burst lines group -->
                <g class="burst-lines" stroke="#4F363F" stroke-width="5.5" stroke-linecap="round" transform="translate(0, -20)">
                    <line x1="0" y1="-15" x2="0" y2="-35" transform="rotate(-100)" />
