<!-- Chat input component — the bottom text box (the agent-start input). Holds the
     output / cli / agent-activated strip areas plus the input bar (the textarea and
     the stop-agent orb). Injected into #chatWrapper by chat_input.js; the agent-
     lifecycle wiring (Enter-to-send, stop button, streaming) stays in script.js and
     attaches on the 'chatinput:ready' event. Add new input-bar components inside
     .input-area-wrapper. -->
<div class="chat-container-content">
    <!-- New Output Stream Area -->
    <div class="output-stream-area">
        <div class="welcome-overlay" id="welcomeOverlay">
            <div class="welcome-eye"></div>
            <div class="welcome-eye"></div>
            <div class="welcome-glow"></div>
        </div>
        <div class="milestone-stream" id="milestoneStream"></div>
    </div>

    <!-- CLI streaming area: takes over the chat box during cli_await -->
    <div class="cli-stream-area" id="cliStreamArea">
        <div class="cli-stream-list" id="cliStreamList"></div>
    </div>

    <!-- Agent Response Strip (Hidden by default) -->
    <div class="agent-response-strip" id="agentResponseStrip">
        <div class="agent-cursor-icon"></div>
        <span class="agent-label">Agent activated:</span>
        <span class="agent-text" id="agentText"></span>
    </div>

    <div class="input-area-wrapper">
        <textarea class="chat-input" placeholder="Select a model in Settings to start..." rows="1" disabled></textarea>

        <!-- Stop Agent Orb Button: embeds pc_button.html (single source of truth for the orb) -->
        <iframe id="stopBtnFrame" class="stop-agent-frame" src="chat_input/pc_button.html"
                title="Stop Agent" scrolling="no" frameborder="0"></iframe>
    </div>
</div>
