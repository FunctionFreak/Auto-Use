<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylized Monitor Face</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      /* Same off-white as the app background so the splash matches the app. */
      background-color: #D0CFC9;
      font-family: sans-serif;
      overflow: hidden;
    }

    .laptop-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      position: fixed;
      transform: scale(0.6);
      transform-origin: center center;
      /* macOS gets a CSS opacity transition applied from JS; Windows drives opacity per frame. */
    }

    .monitor-bezel {
      width: 420px;
      height: 310px;
      background: #3b3b40;
      border-radius: 35px;
      padding: 18px;
      position: relative;
      box-shadow:
        inset -3px -3px 8px rgba(0, 0, 0, 0.6),
        inset 3px 3px 8px rgba(255, 255, 255, 0.15);
    }

    .monitor-screen {
      width: 100%;
      height: 100%;
      background-color: #fffafc;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 55px;
    }

    .eye {
      width: 34px;
      height: 80px;
      border-radius: 30px;
      background: linear-gradient(180deg, #d880be 0%, #8782eb 100%);
      transform: translateY(-50px);
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 85%, 100% { transform: translateY(-50px) scaleY(1); }
      92% { transform: translateY(-50px) scaleY(0.1); }
    }

    .laptop-base {
      width: 500px;
      height: 28px;
      background: #404045;
      border-radius: 12px;
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.2),
        inset 0 -3px 5px rgba(0, 0, 0, 0.5);
    }

    .edge-glow {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 20px;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      box-shadow:
        inset 0 0 60px rgba(220, 160, 255, 0.6),
        inset 0 0 20px rgba(240, 200, 255, 0.4);
    }

    .animated-cursor {
      position: absolute;
      width: 190px;
      z-index: 100;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      pointer-events: none;
      filter: none;
      opacity: 0;
      visibility: hidden;
    }

    .loading-dots {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      opacity: 0;
    }
    .loading-dots .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b0b0b0;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    #particleCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1000;
      pointer-events: none;
    }

  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="laptop-container" id="laptop">
    <div class="monitor-bezel">
      <div class="monitor-screen">
        <div class="eye"></div>
        <div class="eye"></div>
        <div class="edge-glow" id="edgeGlow"></div>
      </div>
      <img class="animated-cursor" id="cursor" src="/cursor.png" alt="3D Cursor">
    </div>
    <div class="laptop-base"></div>
    <div class="loading-dots" id="loadingDots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // Platform detection.
    // The choreography is identical on both. Only the rendering details
    // that each OS needs to stay smooth are branched below.
    // ------------------------------------------------------------------
    const IS_MAC = /Mac|iPhone|iPad|iPod/i.test(
      (navigator.userAgentData && navigator.userAgentData.platform) ||
      navigator.platform ||
      navigator.userAgent
    );

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ASSEMBLE_DURATION = 2200;
    const SETTLE_PAUSE = 500;          // Windows only: hold the finished shape before handover
    const CROSSFADE_DURATION = 600;
    const BUILD_PAUSE = 150;           // pause after the PC is built, before the cursor
    const CURSOR_ENTER_DURATION = 450;
    const CURSOR_PAUSE = 60;
    const CURSOR_CLICK_DURATION = 110;
    const ZOOM_FADE_DURATION = 1800;

    // Shape dimensions (matches CSS exactly)
    const bezelW = 456, bezelH = 346, bezelR = 35;
    const screenW = 420, screenH = 310, screenR = 20;
    const baseW = 500, baseH = 28, baseR = 12;
    const gap = 14;
    const totalH = bezelH + gap + baseH;

    // Eye dimensions
    const eyeW = 34, eyeH = 80, eyeR = 17;
    const eyeGap = 55;
    const eyeOffsetY = -50; // translateY(-50px) from center of screen

    // Check if point is inside a rounded rect (local coords, rect centered at 0,0)
    function inRoundedRect(px, py, w, h, r) {
      const hw = w / 2, hh = h / 2;
      const ax = Math.abs(px), ay = Math.abs(py);
      if (ax <= hw - r && ay <= hh) return true;
      if (ax <= hw && ay <= hh - r) return true;
      if (ax > hw || ay > hh) return false;
      const dx = ax - (hw - r), dy = ay - (hh - r);
      return dx * dx + dy * dy <= r * r;
    }

    // Check if point is inside a pill/capsule shape (local coords, centered at 0,0)
    function inPill(px, py, w, h) {
      const r = w / 2;
      const straightH = h - w;
      const ax = Math.abs(px), ay = Math.abs(py);
      if (ax <= r && ay <= straightH / 2) return true;
      // Top cap
      if (ay > straightH / 2) {
        const dy = ay - straightH / 2;
        return ax * ax + dy * dy <= r * r;
      }
      return false;
    }

    const S = 0.6;  // global scale (40% smaller)
    const SP = 3.5; // spacing

    // macOS renders the small crisp particles cleanly; Windows needs them to
    // overlap the grid step (plus a little jitter) to avoid shimmer.
    const PS = IS_MAC ? 3 * S : SP * S + 0.5;
    const JITTER = IS_MAC ? 0 : 0.4;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Center of bezel
    const bezelCx = 0, bezelCy = -totalH / 2 + bezelH / 2;
    // Center of screen (inside bezel)
    const screenCx = 0, screenCy = bezelCy;
    // Center of base
    const baseCy = -totalH / 2 + bezelH + gap + baseH / 2;
    // Eye centers (relative to screen center)
    const eyeLx = -(eyeGap / 2 + eyeW / 2), eyeRx = (eyeGap / 2 + eyeW / 2);
    const eyeCy = screenCy + eyeOffsetY;

    const targets = [];

    // Scan a bounding area and classify each point
    const scanTop = -totalH / 2 - 5;
    const scanBot = totalH / 2 + 5;
    const scanLeft = -baseW / 2 - 5;
    const scanRight = baseW / 2 + 5;

    for (let y = scanTop; y < scanBot; y += SP) {
      for (let x = scanLeft; x < scanRight; x += SP) {
        // Check eyes first
        const inLeftEye = inPill(x - eyeLx, y - eyeCy, eyeW, eyeH);
        const inRightEye = inPill(x - eyeRx, y - eyeCy, eyeW, eyeH);
        if (inLeftEye || inRightEye) {
          // Eye gradient: pink at top, purple at bottom
          const eyeLocalY = y - eyeCy;
          const t = (eyeLocalY + eyeH / 2) / eyeH;
          const r = Math.round(216 + (135 - 216) * t);
          const g = Math.round(128 + (130 - 128) * t);
          const b = Math.round(190 + (235 - 190) * t);
          targets.push({ x, y, color: `rgb(${r},${g},${b})` });
          continue;
        }

        // Check screen area (off-white)
        const inScreen = inRoundedRect(x - screenCx, y - screenCy, screenW, screenH, screenR);
        if (inScreen) {
          targets.push({ x, y, color: '#fffafc' });
          continue;
        }

        // Check bezel (dark grey)
        const inBezel = inRoundedRect(x - bezelCx, y - bezelCy, bezelW, bezelH, bezelR);
        if (inBezel) {
          const shade = 59 + Math.floor(Math.random() * 6);
          targets.push({ x, y, color: `rgb(${shade},${shade},${shade + 4})` });
          continue;
        }

        // Check base
        const inBase = inRoundedRect(x, y - baseCy, baseW, baseH, baseR);
        if (inBase) {
          const shade = 64 + Math.floor(Math.random() * 5);
          targets.push({ x, y, color: `rgb(${shade},${shade},${shade + 3})` });
          continue;
        }
      }
    }

    // Create particles
    const particles = targets.map(t => {
      const side = Math.floor(Math.random() * 4);
      let sx, sy;
      const margin = 100;
      if (side === 0) { sx = Math.random() * canvas.width; sy = -margin; }
      else if (side === 1) { sx = Math.random() * canvas.width; sy = canvas.height + margin; }
      else if (side === 2) { sx = -margin; sy = Math.random() * canvas.height; }
      else { sx = canvas.width + margin; sy = Math.random() * canvas.height; }

      return {
        sx, sy,
        tx: cx + t.x * S + (Math.random() - 0.5) * JITTER,
        ty: cy + t.y * S + (Math.random() - 0.5) * JITTER,
        x: sx, y: sy,
        color: t.color,
        delay: Math.random() * 0.35
      };
    });

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // macOS hands the fade-in to the compositor; Windows drives it per frame.
    if (IS_MAC) {
      document.getElementById('laptop').style.transition = 'opacity 0.5s ease';
    }

    let startTime = null;
    let phase = 'assemble';
    let splashNotified = false;

    function positionLaptop(laptopEl) {
      laptopEl.style.left = (cx - baseW / 2) + 'px';
      laptopEl.style.top = (cy - totalH / 2) + 'px';
    }

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;

      if (phase === 'assemble') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let allDone = true;

        for (const p of particles) {
          const pElapsed = Math.max(0, elapsed - p.delay * ASSEMBLE_DURATION);
          const progress = Math.min(1, pElapsed / ASSEMBLE_DURATION);
          const eased = easeInOutCubic(progress);

          p.x = p.sx + (p.tx - p.sx) * eased;
          p.y = p.sy + (p.ty - p.sy) * eased;

          if (progress < 1) allDone = false;

          ctx.globalAlpha = 0.4 + 0.6 * progress;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - PS / 2, p.y - PS / 2, PS, PS);
        }
        ctx.globalAlpha = 1;

        if (allDone) {
          phase = IS_MAC ? 'reveal' : 'settle';
          startTime = timestamp;
        }
      } else if (phase === 'settle') {
        // Windows: hold the finished particle shape, then crossfade in JS
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of particles) {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - PS / 2, p.y - PS / 2, PS, PS);
        }
        if (elapsed >= SETTLE_PAUSE) {
          const laptopEl = document.getElementById('laptop');
          positionLaptop(laptopEl);
          laptopEl.style.opacity = 0;
          document.getElementById('loadingDots').style.opacity = 1;
          phase = 'crossfade';
          startTime = timestamp;
        }
      } else if (phase === 'reveal') {
        // macOS: show the laptop and let the CSS transition fade it in
        const laptopEl = document.getElementById('laptop');
        positionLaptop(laptopEl);
        laptopEl.style.opacity = 1;
        document.getElementById('loadingDots').style.opacity = 1;
        phase = 'crossfade';
        startTime = timestamp;
      } else if (phase === 'crossfade') {
        const progress = Math.min(1, elapsed / CROSSFADE_DURATION);
        canvas.style.opacity = 1 - progress;
        if (!IS_MAC) document.getElementById('laptop').style.opacity = progress;
        if (progress >= 1) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.opacity = 1;
          phase = 'build-pause';
          startTime = timestamp;
        }
      } else if (phase === 'build-pause') {
        if (elapsed >= BUILD_PAUSE) {   // cursor comes in almost immediately after the PC is built
          document.getElementById('loadingDots').style.opacity = 0;
          phase = 'cursor-in';
          startTime = timestamp;
        }
      } else if (phase === 'cursor-in') {
        const progress = Math.min(1, elapsed / CURSOR_ENTER_DURATION);
        const eased = easeInOutCubic(progress);
        const cursorEl = document.getElementById('cursor');
        cursorEl.style.visibility = 'visible';

        const startX = 280, startY = 220;
        const endX = 100, endY = 60;
        const curX = startX + (endX - startX) * eased;
        const curY = startY + (endY - startY) * eased;
        cursorEl.style.opacity = Math.min(1, progress * 3);
        cursorEl.style.transform = `translate(${curX}px, ${curY}px) scale(1)`;

        if (progress >= 1) {
          phase = 'cursor-pause';
          startTime = timestamp;
        }
      } else if (phase === 'cursor-pause') {
        if (elapsed >= CURSOR_PAUSE) {
          phase = 'click';
          startTime = timestamp;
        }
      } else if (phase === 'click') {
        // Fast press down — the zoom fires the instant it bottoms out
        const progress = Math.min(1, elapsed / CURSOR_CLICK_DURATION);
        const cursorEl = document.getElementById('cursor');
        const scale = 1 - 0.18 * progress;
        cursorEl.style.transform = `translate(100px, 60px) scale(${scale})`;

        if (progress >= 1) {
          phase = 'zoom-fade';
          startTime = timestamp;
        }
      } else if (phase === 'zoom-fade') {
        // PC zooms in (diving into screen) and fades to blank
        const progress = Math.min(1, elapsed / ZOOM_FADE_DURATION);
        // macOS: ease in and out. Windows: ease-out only, no stall mid-zoom.
        const eased = IS_MAC
          ? easeInOutCubic(progress)
          : 1 - Math.pow(1 - progress, 3);
        const laptopEl = document.getElementById('laptop');
        const glowEl = document.getElementById('edgeGlow');
        const cursorEl = document.getElementById('cursor');

        // Glow snaps on with the click, then fades out with the dive
        const glowIn = Math.min(1, progress / 0.1);
        glowEl.style.opacity = glowIn * (1 - eased);

        // Cursor drops away right after the click
        const cursorFade = Math.min(1, progress / 0.18);
        cursorEl.style.opacity = 1 - cursorFade;
        if (cursorFade >= 1) cursorEl.style.visibility = 'hidden';

        const scale = 1 + eased * 2.5;
        laptopEl.style.transform = `scale(${S * scale})`;
        laptopEl.style.opacity = IS_MAC
          ? 1 - eased
          : Math.max(0, 1 - progress * 1.8);

        // Notify parent early so the app fades in while the zoom dive is still
        // running — keeps the handoff aligned with the splash overlay fade.
        if (progress >= 0.48 && !splashNotified) {
          splashNotified = true;
          if (window.parent && window.parent !== window) {
            window.parent.postMessage('splashDone', '*');
          }
        }

        if (progress >= 1) {
          return; // Stop the animation loop
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
