<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Dial</title>
    <style>
        :root {
            /* Layout box */
            --orb-w: 120px;
            --orb-h: 40px;

            /* Dial geometry */
            --dial-offset: 13px;   /* center slot -> small slot distance */
            --dial-small: 0.7;     /* scale of the unselected word */
            --chev-x: 34px;        /* dial center -> chevron pair */

            /* Text */
            --label-size: 8px;
            --label-idle: #a3a7b3;
            --label-active: #9292d8;   /* base of the color cycle */

            --slide: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        /* wrapper to give the absolutely-positioned button a frame */
        .button-host {
            position: relative;
            width: var(--orb-w);
            height: var(--orb-h);
        }
        body.preview {
            background: #ffffff;
        }
        body.preview .button-host {
            transform: scale(4);
            transform-origin: center;
        }

        .stop-agent-button {
            position: absolute;
            left: 0;
            top: 50%;

            width: var(--orb-w);
            height: var(--orb-h);
            flex-shrink: 0;

            background: transparent;
            border-radius: 999px;

            display: flex;
            align-items: center;
            justify-content: center;

            /* Initially Hidden */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            overflow: visible;
            z-index: 20;
        }

        .stop-agent-button.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .stop-agent-button.pop-vanish {
            animation: stopPopVanish 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            transition: none;
        }

        @keyframes stopPopVanish {
            0%   { transform: translateY(-50%) scale(1); opacity: 1; }
            35%  { transform: translateY(-50%) scale(1.3); opacity: 1; }
            100% { transform: translateY(-50%) scale(0); opacity: 0; }
        }

        .stop-orb {
            position: relative;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* .dial re-enables itself */
        }

        /* Vertical dial. Three slots: small-top / center / small-bottom.
           State A (mode-computer): Computer center, Mobile in the bottom slot.
           Click -> drum rotates UP: Mobile rises to center, Computer shrinks
           into the top slot. Click again -> rotates back down. */
        .dial {
            position: absolute;
            inset: 0;
            pointer-events: auto;
            cursor: pointer;
        }

        .dial-word {
            position: absolute;
            left: 50%;
            top: 50%;
            font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
            font-size: var(--label-size);
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1;
            color: var(--label-idle);
            white-space: nowrap;
            user-select: none;
            transform: translate(-50%, -50%);
            transition: transform var(--slide), opacity var(--slide), color 0.35s ease;
        }

        /* small slots */
        .stop-agent-button.mode-computer .dial-word[data-mode="mobile"] {
            transform: translate(-50%, calc(-50% + var(--dial-offset))) scale(var(--dial-small));
            opacity: 0.65;
        }
        .stop-agent-button.mode-mobile .dial-word[data-mode="computer"] {
            transform: translate(-50%, calc(-50% - var(--dial-offset))) scale(var(--dial-small));
            opacity: 0.65;
        }

        /* center slot: full size, color-cycling with the original hues */
        .stop-agent-button.mode-computer .dial-word[data-mode="computer"],
        .stop-agent-button.mode-mobile   .dial-word[data-mode="mobile"] {
            color: var(--label-active);
            animation: stop-labelColor 4s linear infinite;
        }

        /* light glint crossing the center word */
        .stop-agent-button.mode-computer .dial-word[data-mode="computer"]::before,
        .stop-agent-button.mode-mobile   .dial-word[data-mode="mobile"]::before {
            content: "";
            position: absolute;
            top: -1px;
            bottom: -1px;
            left: 0;
            width: 40%;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.85) 50%,
                rgba(255,255,255,0) 100%);
            transform: translateX(-140%);
            animation: word-shine 4s ease-in-out infinite;
        }

        /* Up + down chevrons stacked (^ over v) - the dial-goes-both-ways hint.
           One static element pinned beside the center slot: it does NOT ride the
           words, so it stays put while the dial rotates. */
        .chev {
            position: absolute;
            left: calc(50% + var(--chev-x));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 0;
            pointer-events: none;
            color: var(--label-active);
            animation: stop-labelColor 4s linear infinite;
        }
        .chev i {
            display: block;
            width: 4px;
            height: 4px;
            border-top: 1.2px solid currentColor;
            border-right: 1.2px solid currentColor;
        }
        .chev i.up { transform: rotate(-45deg); }   /* ^ */
        /* The rotated 4px boxes are mostly empty around the glyphs, so the pair
           reads far apart even at gap 0. Overlap the boxes to bring the actual
           chevrons together. */
        .chev i.dn { transform: rotate(135deg); margin-top: -2px; }   /* v */

        /* #9292d8 base with the original overlay colors blended in at 20% -
           same hues the old rotating disc drifted through. */
        @keyframes stop-labelColor {
            0%, 100% { color: #9292d8; }
            20% { color: #a875ad; }   /* red   */
            40% { color: #88a8c6; }   /* green */
            60% { color: #7e99e0; }   /* blue  */
            80% { color: #a789e0; }   /* pink  */
        }

        @keyframes word-shine {
            0%, 55%  { transform: translateX(-140%); opacity: 0; }
            65%      { opacity: 0.45; }
            100%     { transform: translateX(320%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="button-host">
        <div class="stop-agent-button mode-computer" id="stopAgentBtn">
            <div class="stop-orb">
                <div class="dial" id="dial">
                    <div class="dial-word" data-mode="computer">Computer use</div>
                    <div class="dial-word" data-mode="mobile">Mobile use</div>
                    <span class="chev"><i class="up"></i><i class="dn"></i></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stopBtn = document.getElementById('stopAgentBtn');
        const dial = document.getElementById('dial');

        // ---- DESIGN MODE ----------------------------------------------------
        // Set to false (or delete this and the `|| FORCE_PREVIEW` below) when you
        // drop this file back into the app. While it's true it is always shown and
        // zoomed 4x so we can actually see what we're editing.
        const FORCE_PREVIEW = true;
        // ---------------------------------------------------------------------

        // window.parent === window means the file was opened directly (not embedded).
        const standalone = FORCE_PREVIEW || window.parent === window;

        if (standalone) {
            document.body.classList.add('preview');
            stopBtn.classList.add('active');
        }

        function currentMode() {
            return stopBtn.classList.contains('mode-mobile') ? 'mobile' : 'computer';
        }

        // 'computer' | 'mobile'. The class drives the dial; no JS geometry.
        function setMode(mode, notify = true) {
            stopBtn.classList.toggle('mode-mobile', mode === 'mobile');
            stopBtn.classList.toggle('mode-computer', mode !== 'mobile');
            if (notify && !standalone) parent.postMessage('pcbtn:mode:' + mode, '*');
        }

        // Click anywhere on the dial flips it.
        dial.addEventListener('click', () => {
            setMode(currentMode() === 'computer' ? 'mobile' : 'computer');
        });

        // Expand a little, then completely vanish (and reset so it can show again later).
        function vanish() {
            if (!stopBtn.classList.contains('active')) return;
            if (stopBtn.classList.contains('pop-vanish')) return;
            stopBtn.classList.add('pop-vanish');
            setTimeout(() => stopBtn.classList.remove('active', 'pop-vanish'), 600);
        }

        // Commands from the parent app.
        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (msg === 'pcbtn:show') {
                stopBtn.classList.remove('pop-vanish');
                stopBtn.classList.add('active');
            } else if (msg === 'pcbtn:vanish') {
                vanish();
            } else if (msg === 'pcbtn:hide') {
                stopBtn.classList.remove('active', 'pop-vanish');
            } else if (msg === 'pcbtn:mode:computer') {
                setMode('computer', false);
            } else if (msg === 'pcbtn:mode:mobile') {
                setMode('mobile', false);
            }
        });
    </script>
</body>
</html>
