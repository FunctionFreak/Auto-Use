        // --- Main Animation Loop ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            
            // --- Timeline: find the active segment (built from SEQ at load time) ---
            let t = time % CYCLE_MS;
            let shape1 = 'l', shape2 = 'l', localPhase = 0;
            for (let si = 0; si < SEGMENTS.length; si++) {
                const seg = SEGMENTS[si];
                if (t < seg.end) {
                    shape1 = seg.s1;
                    shape2 = seg.s2;
                    localPhase = seg.isHold ? 0 : (t - seg.start) / (seg.end - seg.start);
                    break;
                }
            }

            const ePhase = easeInOutCubic(localPhase);
            
            // Pinch and Swirl only happen during transitions
            const pinchFactor = 1.0 - Math.sin(ePhase * Math.PI) * 0.9;
            const swirlFactor = Math.sin(ePhase * Math.PI) * Math.PI * 1.5;

            // Generic "Solidification" Opacities: Crossfade particles out and perfect vector shape in
            let vOpacity1 = 0, vOpacity2 = 0;

            if (shape1 === shape2) {
                vOpacity1 = 1.0;
            } else {
                vOpacity1 = Math.pow(1 - ePhase, 4);
                vOpacity2 = Math.pow(ePhase, 4);
            }

            let pTargetAlpha = 1.0 - Math.max(vOpacity1, vOpacity2);

            const perspective = 300;
            ctx.fillStyle = PARTICLE_COLOR;

            // --- Draw Swarming Particles ---
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                const pos1 = getShapePos(shape1, p, time);
                const pos2 = getShapePos(shape2, p, time);

                // Apply Collapse (Pinch)
                let currentX = (pos1.x + (pos2.x - pos1.x) * ePhase) * pinchFactor;
                let currentY = (pos1.y + (pos2.y - pos1.y) * ePhase) * pinchFactor;
                let currentZ = (pos1.z + (pos2.z - pos1.z) * ePhase) * pinchFactor;

                // Apply Swirl
                const s = Math.sin(swirlFactor);
                const c = Math.cos(swirlFactor);
                const rx = currentX * c - currentY * s;
                const ry = currentX * s + currentY * c;
                currentX = rx;
                currentY = ry;

                // Project 3D onto 2D Canvas
                const scale = perspective / (perspective + currentZ);
                const projX = cx + currentX * scale;
                const projY = cy + currentY * scale;

                // Opacity logic (depth shading for the globe)
                let opacity = 1.0;
                let is3DMix = (shape1 === 'g' ? 1 - ePhase : 0) + (shape2 === 'g' ? ePhase : 0);
                if (is3DMix > 0) {
                    const depthOpacity = 0.3 + 0.7 * (1 - (currentZ + GLOBE_RADIUS) / (2 * GLOBE_RADIUS));
                    opacity = 1.0 - is3DMix * (1.0 - depthOpacity);
                }
                
                // Fade out particles seamlessly as the vector shape forms
                let finalOpacity = opacity * pTargetAlpha;

                if (finalOpacity > 0.01) {
                    ctx.globalAlpha = Math.max(0.01, finalOpacity);
                    const currentPRadius = pos1.pRadius + (pos2.pRadius - pos1.pRadius) * ePhase;
                    const size = currentPRadius * scale;

                    ctx.beginPath();
                    ctx.arc(projX, projY, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // --- Draw the "Flawless" Vector Shapes Over The Particles ---
            function drawSolidVector(targetShape, vOpacity) {
                if (vOpacity <= 0.01) return;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(pinchFactor, pinchFactor);
                ctx.rotate(swirlFactor);
                
                ctx.globalAlpha = vOpacity;
                ctx.fillStyle = PARTICLE_COLOR;
                ctx.strokeStyle = PARTICLE_COLOR;
                
                if (targetShape === 'l') {
                    // --- Solid Loader ---
                    const loaderOuterAngle = time * 0.0015;
                    const loaderInnerAngle = -time * 0.0025;
                    ctx.lineCap = 'round';
                    
                    ctx.lineWidth = 5;
                    for(let i = 0; i < OUTER_SPOKES; i++) {
                        let angle = (i / OUTER_SPOKES) * Math.PI * 2 + loaderOuterAngle;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * 32, Math.sin(angle) * 32);
                        ctx.lineTo(Math.cos(angle) * 42, Math.sin(angle) * 42);
                        ctx.stroke();
                    }
                    
                    ctx.lineWidth = 3.6;
                    for(let i = 0; i < INNER_SPOKES; i++) {
                        let angle = (i / INNER_SPOKES) * Math.PI * 2 + loaderInnerAngle;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * 16, Math.sin(angle) * 16);
                        ctx.lineTo(Math.cos(angle) * 22, Math.sin(angle) * 22);
                        ctx.stroke();
                    }
                }
                else if (targetShape === 'g') {
                    // --- Solid Globe (continuous wireframe, zero beading) ---
                    const earthSpinAngle = time * 0.001;
                    const perspective = 300;

                    const project = (phi, theta) => {
                        const currentTheta = theta + earthSpinAngle;
                        const ex = Math.sin(phi) * Math.cos(currentTheta) * GLOBE_RADIUS;
                        const ey = Math.cos(phi) * GLOBE_RADIUS;
                        const ez = Math.sin(phi) * Math.sin(currentTheta) * GLOBE_RADIUS;
                        const scale = perspective / (perspective + ez);
                        return { x: ex * scale, y: ey * scale, z: ez };
                    };

                    ctx.lineWidth = 1.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Draw each wire as continuous strokes, breaking ONLY where it
                    // crosses the front/back silhouette. Each run is one smooth path
                    // (round joins) so there are no beads — every wire is a clean line.
                    const SEG = 64;
                    const drawWire = (pointAt) => {
                        let pts = [];
                        for (let k = 0; k <= SEG; k++) pts.push(pointAt(k / SEG));
                        let i = 0;
                        while (i < SEG) {
                            const front = (pts[i].z + pts[i + 1].z) < 0;
                            let j = i + 1;
                            while (j < SEG && (((pts[j].z + pts[j + 1].z) < 0) === front)) j++;
                            let sumZ = 0;
                            for (let m = i; m <= j; m++) sumZ += pts[m].z;
                            const avgZ = sumZ / (j - i + 1);
                            const depth = 0.3 + 0.7 * (1 - (avgZ + GLOBE_RADIUS) / (2 * GLOBE_RADIUS));
                            ctx.globalAlpha = vOpacity * Math.max(0.18, Math.min(1, depth));
                            ctx.beginPath();
                            ctx.moveTo(pts[i].x, pts[i].y);
                            for (let m = i + 1; m <= j; m++) ctx.lineTo(pts[m].x, pts[m].y);
                            ctx.stroke();
                            i = j; // next run shares this vertex -> seamless, no gap
                        }
                    };

                    // Longitudes (meridians)
                    for (let i = 0; i < 12; i++) {
                        let theta = (i / 12) * Math.PI * 2;
                        drawWire((u) => project(u * Math.PI, theta));
                    }
                    // Latitudes (parallels)
                    for (let i = 0; i < 8; i++) {
                        let phi = ((i + 1) / 9) * Math.PI;
                        drawWire((u) => project(phi, u * Math.PI * 2));
                    }
                    ctx.globalAlpha = vOpacity; // Restore standard alpha for other rendering
                }
                else if (targetShape === 's') {

                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-35, -25, 70, 45, 6);
                    else ctx.rect(-35, -25, 70, 45); 
                    ctx.stroke();
                    
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-20, 30, 40, 6, 3);
                    else ctx.rect(-20, 30, 40, 6);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.rect(-6, 20, 12, 10);
                    ctx.fill();
                } 
                else if (targetShape === 'tr') {
                    // --- Solid Node Tree ---
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    const nodes = [
                        {id: 0, x: 0, y: -25},
                        {id: 1, x: -20, y: 0}, {id: 2, x: 20, y: 0},
                        {id: 3, x: -35, y: 25}, {id: 4, x: -20, y: 25}, {id: 5, x: -5, y: 25},
                        {id: 6, x: 5, y: 25}, {id: 7, x: 20, y: 25}, {id: 8, x: 35, y: 25}
                    ];
                    const edges = [ [0,1], [0,2], [1,3], [1,4], [1,5], [2,6], [2,7], [2,8] ];

                    // Connect lines
                    ctx.beginPath();
                    edges.forEach(e => {
                        ctx.moveTo(nodes[e[0]].x, nodes[e[0]].y);
                        ctx.lineTo(nodes[e[1]].x, nodes[e[1]].y);
                    });
                    ctx.stroke();

                    // Draw circles
                    nodes.forEach(n => {
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                else if (targetShape === 'sv') {
                    // --- Solid Server Rack ---
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Chassis
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-25, -35, 50, 70, 4);
                    else ctx.rect(-25, -35, 50, 70);
                    ctx.stroke();

                    // Divider Lines
                    ctx.beginPath();
                    ctx.moveTo(-25, -12); ctx.lineTo(25, -12);
                    ctx.moveTo(-25, 12); ctx.lineTo(25, 12);
                    ctx.stroke();

                    // Blade Details (lights and drives)
                    const blades = [-23.5, 0, 23.5];
                    blades.forEach(yCenter => {
                        // Light
                        ctx.beginPath();
                        ctx.arc(-15, yCenter, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        // Drive slot
                        ctx.beginPath();

                    });
                }
                else if (targetShape === 't') {
                    // --- Solid Checkmark Tick ---
                    ctx.beginPath();
                    ctx.arc(0, 0, TICK_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Carve out checkmark using destination-out
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 13;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-14, 2);
                    ctx.lineTo(-4, 12);
                    ctx.lineTo(16, -8);
                    ctx.stroke();
                }
                else if (targetShape === 'coder') {
                    // --- "coder": single AI head (blinking) ---
                    ctx.fillStyle = PARTICLE_COLOR;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-30, -30, 60, 60, 13);
                    else ctx.rect(-30, -30, 60, 60);
                    ctx.fill();

                    // Synchronize the blink animation with the timeline (1.8s loop = 1800ms)
                    let blinkTime = time % 1800;
                    let eyeScaleY = 1;
                    if (blinkTime > 1620) { // 90% of 1.8s
                        if (blinkTime < 1710) { // 95% of 1.8s
                            eyeScaleY = 1 - ((blinkTime - 1620) / 90) * 0.92; // scaleY down to 0.08
                        } else {
                            eyeScaleY = 0.08 + ((blinkTime - 1710) / 90) * 0.92; // scaleY back up to 1
                        }
                    }
                    
                    let eyeHeight = 14 * eyeScaleY;
                    let eyeY = -5 - (eyeHeight / 2);
                    let eyeRadius = Math.min(4, eyeHeight / 2);

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(-12, eyeY, 8, eyeHeight, eyeRadius);
                        ctx.roundRect(4, eyeY, 8, eyeHeight, eyeRadius);
                    } else {
                        ctx.rect(-12, eyeY, 8, eyeHeight);
                        ctx.rect(4, eyeY, 8, eyeHeight);

                    ctx.fill();
                }
                else if (targetShape === 'minion') {
                    // --- "minion": three AI heads, a parent branching to two ---
                    ctx.strokeStyle = PARTICLE_COLOR;
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(AINODE.l1[0], AINODE.l1[1]); ctx.lineTo(AINODE.l1[2], AINODE.l1[3]); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(AINODE.l2[0], AINODE.l2[1]); ctx.lineTo(AINODE.l2[2], AINODE.l2[3]); ctx.stroke();
                    drawSmallHead(ctx, AINODE.left[0], AINODE.left[1], AINODE.half, time);
                    drawSmallHead(ctx, AINODE.h1[0], AINODE.h1[1], AINODE.half, time);
                    drawSmallHead(ctx, AINODE.h2[0], AINODE.h2[1], AINODE.half, time);
                }
                else if (targetShape === 'sh') {
                    // --- Solid Apple Terminal (">" prompt + Apple logo) ---
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Window Outline
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-35, -25, 70, 50, 4);
                    else ctx.rect(-35, -25, 70, 50);
                    ctx.stroke();

                    // Top Bar Separator
                    ctx.beginPath();
                    ctx.moveTo(-35, -15);
                    ctx.lineTo(35, -15);
                    ctx.stroke();

                    // ">" prompt chevron at the top-left (matches the shell)
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-26, -9);
                    ctx.lineTo(-21, -5);
                    ctx.lineTo(-26, -1);
                    ctx.stroke();

                    // Vector Apple logo inside the terminal
                    ctx.save();
                    ctx.translate(0, 4); // Shift down into the terminal window (matches particles)
                    ctx.scale(1.3, 1.3); // Scale up
                    ctx.translate(-12, -12); // Center the SVG path visually
                    
                    const applePath = new Path2D("M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z");
                    ctx.fill(applePath);
                    ctx.restore();
                }
                else if (targetShape === 'cl') {
                    // --- Solid Terminal Shell (">" prompt + three text lines) ---
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Window Outline
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-35, -25, 70, 50, 4);
                    else ctx.rect(-35, -25, 70, 50);
                    ctx.stroke();

                    // Top Bar Separator
                    ctx.beginPath();
                    ctx.moveTo(-35, -15);
                    ctx.lineTo(35, -15);
                    ctx.stroke();

                    // ">" prompt chevron
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-26, -9);
                    ctx.lineTo(-21, -5);
                    ctx.lineTo(-26, -1);
                    ctx.stroke();

                    // Three text lines (varying lengths, like terminal output)
                    ctx.lineWidth = 3;
                    const cliLines = [
                        { x1: -16, x2: 14, y: -5 },
                        { x1: -26, x2: 20, y: 5 },
                        { x1: -26, x2: 4,  y: 15 }
                    ];
                    cliLines.forEach(L => {
                        ctx.beginPath();
                        ctx.moveTo(L.x1, L.y);
                        ctx.lineTo(L.x2, L.y);
                        ctx.stroke();
                    });
                }
                else if (targetShape === 'ck') {
                    // --- Solid Clock (face ring, 12 ticks, hour + minute hands at 10:10) ---
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Face ring
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, CLOCK_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();

                    // 12 hour ticks
                    ctx.lineWidth = 2.5;
                    for (let i = 0; i < 12; i++) {

                        let dx = Math.sin(a), dy = -Math.cos(a);

                        ctx.moveTo(dx * 28, dy * 28);
                        ctx.lineTo(dx * 31.5, dy * 31.5);

                    ctx.beginPath();
                    ctx.moveTo(0, 0);

                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);

                    ctx.arc(0, 0, 2.6, 0, Math.PI * 2);

                    drawCursorVector(CURSOR_PTS, CURSOR_PIVOT_L, clickScale(time, 62500, 67500, 2));

                }

                    drawMouseShape(ctx, mouseScrollY(time));
                }
                else if (targetShape === 'pn') {

                    // --- Camera ---

                }

                    drawDragDropShape(ctx, bp.x, bp.y);

                    // --- Plain todo list (static, no checks) ---
                    drawTodoShape(ctx, [0, 0, 0]);

                    drawTodoShape(ctx, todoUpdateAlphas(time));

                    const lp = viewFileLensPos(time);
                    drawViewFileShape(ctx, lp.x, lp.y);

                    ctx.lineJoin = 'round';
                    ctx.fillStyle = PARTICLE_COLOR;
                    ctx.strokeStyle = PARTICLE_COLOR;
                    ctx.lineWidth = 2.6;
                    GLOB_CARDS.forEach((card, i) => {
                        if (m && m.alphas[i] * m.env > 0.01) {
                            ctx.save();
                            ctx.globalAlpha = vOpacity * m.alphas[i] * m.env * 0.5;
                            globCardPath(ctx, card.x, card.y);
                            ctx.fill();
                            ctx.restore();
                        }
                        ctx.globalAlpha = vOpacity;
                        globCardPath(ctx, card.x, card.y);
                        ctx.stroke();
                    });
                    drawGlobStar(ctx, pulse);
                }
                else if (targetShape === 'replace') {
                    // --- replace: a horizontal code file; lines scroll up/down, then get replaced ---
                    ctx.strokeStyle = PARTICLE_COLOR;
                    drawReplaceWindow(ctx);
                    const an = replaceAnim(time);
                    drawReplaceLines(ctx, an.m, an.scrollY, vOpacity);
                }
                else if (targetShape === 'pr') {
                    // --- Progress tracker: outlined circle fills solid from the top to complete ---
                    const pr = progressVal(time);
                    const env = pr ? pr.env : 0;
                    const R = 31;
                    // solid pie fill from the top (center to edge), drawn under the outline
                    if (pr && env > 0.01) {
                        const start = -Math.PI / 2, end = start + Math.PI * 2 * pr.ph;
                        ctx.save();
                        ctx.globalAlpha = vOpacity * env;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.arc(0, 0, R, start, end, false);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    // circle outline on top (transparent inside; matches particles)
                    ctx.save();
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, R, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                else if (targetShape === 'ap') {
                    // --- Open box (lid flaps splayed) with the word "apps" rising out ---
                    drawAppBoxShape(ctx);
                    const w = appWord(time);
                    if (w && w.alpha > 0.01) {
                        ctx.save();
                        ctx.globalAlpha = vOpacity * w.alpha;
                        ctx.fillStyle = PARTICLE_COLOR;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.font = '700 ' + (17 * w.scale).toFixed(1) + 'px ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif';
                        ctx.fillText('apps', 0, w.y);
                        ctx.restore();
                    }
                }
                else if (targetShape === 'bk') {
                    // --- Open book lying in perspective, with a page lifting & turning ---
                    drawBookShape(ctx); // static base: both pages + spine + text
                    const ang = pageTurnAngle(time);
                    if (ang > 0.001) {
                        ctx.save();
                        // rotate the leaf about the spine while LIFTING it up (rises, then
                        // lays onto the left) — x foreshortens by cos, y lifts by sin*dist.
                        ctx.transform(Math.cos(ang), -Math.sin(ang) * 0.75, 0, 1, 0, 0);
                        drawBookLeaf(ctx);
                        ctx.restore();
                    }
                }
                
                ctx.restore();
            }

            drawSolidVector(shape1, vOpacity1);
            if (shape1 !== shape2) {
                drawSolidVector(shape2, vOpacity2);
            }

            requestAnimationFrame(animate);
        }

        // Start Engine
        initParticles();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
